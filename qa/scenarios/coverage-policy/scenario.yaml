  action: Release or retain only eligible inert owned Project/Ticket/worktree/branch state with exact identity,
    review owner, bounded location and deletion instructions.
  checks:
  - id: cleanup.git
    capabilities:
    - SESSION-RUNTIME-LIFECYCLE
    - SECURITY-RUNTIME-ISOLATION
    stimulus: Release or retain only eligible inert owned Project/Ticket/worktree/branch state with exact identity,
      review owner, bounded location and deletion instructions.
    expected: Release or retain only eligible inert owned Project/Ticket/worktree/branch state with exact identity,
      review owner, bounded location and deletion instructions.
    authority_ref: https://github.com/boldaxolotl/booley/blob/main/qa/doc/FINISH.md
    evidence: 'Exact CLI argv/MCP request, exit/envelope, timestamps, Target/tests and source/build/runtime/model
      identities; hashes of native per-run data, Campaign/Simulation and relevant Criteria snapshots. For Analyst
      retain actual transcript, bounded tool responses and audit. Independent oracle compares raw native data with
      normalized points and fixed expected operands; source rollups only for line/branch/expression/toggle, overall
      rollups for cover_property. For faults preserve the concrete mutation or consumed syscall/provider handshake
      before restoration. Specific result to demonstrate: Release or retain only eligible inert owned Project/Ticket/worktree/branch
      state with exact identity, review owner, bounded location and deletion instructions.'
    capture: evidence/coverage-policy.cleanup.git
  timeout_minutes: 5
