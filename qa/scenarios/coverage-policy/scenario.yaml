inputs:
- id: release
  kind: pre-run
  value: Exact immutable booley-rtl package SHA-256, full source commit, matching docs, runtime image digest and
    selected provider/model identity.
  source: https://github.com/boldaxolotl/booley/blob/main/README.md
  verification: Record identities before setup; pre-run selection cannot alter fixture bytes, suites or thresholds.
- id: verilator
  kind: git
  value: ea338be98e1e838d3518809ce8899f85a009963c
  source: https://github.com/verilator/verilator/tree/ea338be98e1e838d3518809ce8899f85a009963c
  verification: Record exact tool source identity and v5.052; 5.050 rejected.
authority:
- Maintainer approved fixture/policy/waiver inputs only; act inside ledgered run-owned Project/runtime and fault
  roots.
- No product/SDK patch or private evaluator import. Simulated external inputs are labeled boundary evidence; live-provider
  Checks require real selected client.
- Preserve pins, thresholds, exact suites and every original failure. No push, issue submission, remote publication
  or permanent repair.
- Restoration never depends on successful detection. Enter unconditional cleanup by minute 450; preserve borrowed
  resources and secrets.
budget:
  deadline_minutes: 480
  cleanup_minutes: 30
  contingency_minutes: 96
  cleanup_start_minutes: 450
  final_regression_start_minutes: 426
phases:
- id: prepare
  title: Artifact, fixture and independent oracle preparation
  minutes: 52
- id: baseline
  title: Fresh named local baselines
  minutes: 72
- id: exercise
  title: Expanded checks and independent restorations
  minutes: 206
- id: final
  title: Fresh regression, Analyst and evidence archive
  minutes: 24
- id: cleanup
  title: Unconditional resource cleanup
  minutes: 30
