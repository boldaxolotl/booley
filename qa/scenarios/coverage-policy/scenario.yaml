configured_scenarios:
- id: coverage-policy-ubuntu-codex-cli
  required: true
  parameters:
    host_os: Ubuntu 24.04
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Codex
    interactive_mode_client: native CLI
    ticket_mode_backend: Codex
  pre_run_requirements:
  - Immutable installed product artifact SHA-256, full source commit, matching docs and image digest; no editable/source
    install.
  - Docker/storage and selected provider authentication; no credential bytes in evidence.
  - Pinned Verilator v5.052 ea338be98e1e838d3518809ce8899f85a009963c, Yosys formal SAT support, gcc and Python in
    issued Linux Session Runtime.
  - Exact Specialist model and external CLI/SDK identities; Codex exact-model metadata cache available when selected.
  - Authority over declared disposable Projects/Tickets/local branches, runtime processes and fault roots; no host-wide
    LD_PRELOAD or binary replacement.
  - Read shared coverage/RUNBOOK.md exact workload, baseline, approval and fault recipes. Numeric/policy thresholds
    cannot be varied.
  check_sets:
  - coverage-policy-core
  exclusions: []
