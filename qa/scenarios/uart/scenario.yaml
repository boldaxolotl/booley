    Execute `review-clean-blocked` using the attached scenario-owned probe contract.
    Each of `review-rtl-bugs` (picorv32), `review-protocol` (taxi), `review-spec` (uart), `review-code-style` (taxi), `review-optimization` (picorv32), `review-security` (uart), `review-tb-quality` (uart) invokes that public focus → report explicitly identifies it. UART: `review-done` seeded real finding → advisory done evidence; `review-clean-blocked` unresolved MINOR or greater → clean not met; `review-clean-waived` explicit finding waiver → clean current; `review-stale` relevant edit → both stale; `review-rerun` corrected source rerun → fresh evidence. `review-guidance`: controlled Project-guide conflict → supplied Project guide wins, bundled guides still present.
  checks:
  - id: inventory.S-01.review-clean-blocked
    capabilities:
    - S-01
