      Runtime IDs/spec digest/process listing before/after. `runtime-retry`: repeat up/enter after interruption → usable clean runtime on both OSes. VS Code: `legacy-replace` exactly one authenticated legacy container → only it replaced; `legacy-refuse-ambiguous`, `legacy-refuse-foreign`, `legacy-refuse-headless`, `legacy-refuse-multiple` → each refused with all other identities intact; `legacy-poststop-failure` → exact restart command after validation failure; `legacy-restart` → supplied command restores usable runtime, named volumes unchanged. Retain argv, exit, stdout/stderr, fresh invocation, source/Target/runtime identities, before/after state and raw artifacts before restoration.
    capture: evidence/opentitan-uart-clean-room-greenfield.inventory.H-06.enter-failure
