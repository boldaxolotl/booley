inputs:
- id: release
  kind: pre-run
  value: |-
    Exact immutable booley-rtl build, package SHA-256, source commit, matching docs and runtime image digest. A published release or unreleased candidate artifact is allowed; no floating reference, editable install or source-checkout execution/import.
  source: https://github.com/boldaxolotl/booley
  verification: Record version, source commit, executable/import origin, package hash, documentation identity and image payload provenance before work.
- id: corpus
  kind: git
  value: 615d3c74fadbbf674c8ca05a70f91094989849fb
  source: https://github.com/lowRISC/opentitan/tree/615d3c74fadbbf674c8ca05a70f91094989849fb
  verification: |-
    Verify exact object, clean source and per-file hashes; retain before preparation. UART reads only the seven allowlisted documentation files.
authority:
- |-
  Act only inside declared run-owned Projects, branches, fixture roots and runtimes; ledger every resource before mutation.
- |-
  Baseline source pins are immutable. Later edits require the attached prompt/Ticket scope; retain accepted Ticket outputs and discard temporary faults and Interactive experiments as prescribed.
- |-
  No external push, issue submission or permanent Booley repair. No source inspection before observing a product failure. No private internals as product proof.
- |-
  Keep credentials outside Projects and evidence; preserve borrowed installations, credentials, shared images/caches and unrelated state.
- UART evaluator, seed and generated cases remain Scenario Operator-held outside Developer filesystem, runtime, mounts and
  network.
- |-
  Recovery stays within this live run and phase allowance; no Scenario Operator resume or replay. Retain failures, classify missing work blocked and enter cleanup on time.
budget:
  deadline_minutes: 480
  cleanup_minutes: 30
  contingency_minutes: 15
  cleanup_start_minutes: 450
phases:
- id: prepare
  title: Preparation/bootstrap
  minutes: 45
- id: interactive
  title: Setup/Interactive
  minutes: 45
- id: feature
  title: Feature development and acceptance
  minutes: 180
- id: evaluate
  title: Evaluator controls and initial full evaluation
  minutes: 30
- id: repairs
  title: At most two repairs and complete reruns, 45 minutes each
  minutes: 90
- id: external
  title: External-image lifecycle including local cleanup
  minutes: 15
- id: final
  title: Final regression/archive
  minutes: 30
- id: cleanup
  title: Finish and quiesce
  minutes: 30
steps:
- id: published-release
  phase: prepare
  action: Install and identify the exact declared Booley package artifact, published or unreleased.
  checks:
  - id: published-release
    capabilities:
    - PRODUCT-ARTIFACT-INSTALLATION
    stimulus: Install and identify the exact declared Booley package artifact, published or unreleased.
    expected: |-
      Package hash/version, source commit and matching documentation identify the build; no floating reference, editable install or Booley-source execution/import. A local candidate wheel is allowed when its content hash and source commit are recorded.
    authority_ref: https://github.com/boldaxolotl/booley/blob/b163fd1f45b76f3950005678e500e695232832fb/qa/handoff/uart.md
    evidence: |-
      Package hash/version, source commit, matching documentation identity, executable/import origin and image provenance identify the build and prove isolation from source checkouts.
    capture: evidence/opentitan-uart-clean-room-greenfield.published-release
- id: run-inputs
  phase: prepare
  action: Freeze run manifest before product work.
  checks:
  - id: run-inputs
    capabilities:
    - DOCUMENTATION-USABILITY
    stimulus: Freeze run manifest before product work.
    expected: |-
      Suite/protocol, provider/client/backend, platform, initial image, corpus/interface/evaluator digests, seed, owned repositories/branches, deadline and secret-free credential mechanism recorded.
    authority_ref: https://github.com/boldaxolotl/booley/blob/b163fd1f45b76f3950005678e500e695232832fb/qa/handoff/uart.md
    evidence: |-
      Suite/protocol, provider/client/backend, platform, initial image, corpus/interface/evaluator digests, seed, owned repositories/branches, deadline and secret-free credential mechanism recorded.
    capture: evidence/opentitan-uart-clean-room-greenfield.run-inputs
  requires:
  - published-release
- id: delegation
  phase: prepare
  action: Assign setup, development, evaluation, diagnostics and cleanup.
  checks:
  - id: delegation
    capabilities:
    - DOCUMENTATION-USABILITY
    stimulus: Assign setup, development, evaluation, diagnostics and cleanup.
    expected: Recorded delegate identities perform actual work; the Scenario Operator sequences and integrates evidence.
    authority_ref: https://github.com/boldaxolotl/booley/blob/b163fd1f45b76f3950005678e500e695232832fb/qa/handoff/uart.md
    evidence: Recorded delegate identities perform actual work; the Scenario Operator sequences and integrates evidence.
    capture: evidence/opentitan-uart-clean-room-greenfield.delegation
  requires:
  - published-release
- id: authority
  phase: prepare
  action: Declare edits, commits, Ticket creation and local acceptance before execution.
  checks:
  - id: authority
    capabilities:
    - SECURITY-RUNTIME-ISOLATION
    stimulus: Declare edits, commits, Ticket creation and local acceptance before execution.
    expected: No live run approval, push, external report or permanent Booley repair; resource actions stay within
      declaration.
    authority_ref: https://github.com/boldaxolotl/booley/blob/b163fd1f45b76f3950005678e500e695232832fb/qa/handoff/uart.md
    evidence: No live run approval, push, external report or permanent Booley repair; resource actions stay within
      declaration.
    capture: evidence/opentitan-uart-clean-room-greenfield.authority
  requires:
  - published-release
- id: empty-origin
  phase: prepare
  action: Create owned empty repository on disposable host/account.
  checks:
  - id: empty-origin
    capabilities:
    - DOCUMENTATION-USABILITY
    stimulus: Create owned empty repository on disposable host/account.
    expected: |-
      Initial tree and host/Docker state prove empty origin and absent managed state for fresh-bootstrap claims; no deletion of others' resources.
    authority_ref: https://github.com/boldaxolotl/booley/blob/b163fd1f45b76f3950005678e500e695232832fb/qa/handoff/uart.md
    evidence: |-
      Initial tree and host/Docker state prove empty origin and absent managed state for fresh-bootstrap claims; no deletion of others' resources.
    capture: evidence/opentitan-uart-clean-room-greenfield.empty-origin
  requires:
