format_version: 1
scenario_id: opentitan-uart-clean-room-greenfield
title: Documentation-only standalone UART
source: https://github.com/boldaxolotl/booley/issues/376#issuecomment-5596872672
inputs:
- id: release
  kind: pre-run
  value: |-
    Exact published booley-rtl release, package SHA-256, matching docs and immutable runtime image digest; no editable/local/development package or source imports.
  source: https://github.com/boldaxolotl/booley/releases
  verification: Record version, executable/import origin, package hash and image payload provenance before work.
- id: corpus
  kind: git
  value: 615d3c74fadbbf674c8ca05a70f91094989849fb
  source: https://github.com/lowRISC/opentitan/tree/615d3c74fadbbf674c8ca05a70f91094989849fb
  verification: |-
    Verify exact object, clean source and per-file hashes; retain before preparation. UART reads only the seven allowlisted documentation files.
authority:
- |-
  Act only inside declared run-owned Projects, branches, fixture roots and runtimes; ledger every resource before mutation.
- |-
  Baseline source pins are immutable. Later edits require the attached prompt/Ticket scope; retain accepted Ticket outputs and discard temporary faults and Interactive experiments as prescribed.
- |-
  No external push, issue submission or permanent Booley repair. No source inspection before observing a product failure. No private internals as product proof.
- |-
  Keep credentials outside Projects and evidence; preserve borrowed installations, credentials, shared images/caches and unrelated state.
- UART evaluator, seed and generated cases remain operator-held outside Developer filesystem, runtime, mounts and
  network.
- |-
  Recovery stays within this live run and phase allowance; no coordinator resume or replay. Retain failures, classify missing work blocked and enter cleanup on time.
budget:
  deadline_minutes: 480
  cleanup_minutes: 30
  contingency_minutes: 15
  cleanup_start_minutes: 450
phases:
- id: prepare
  title: Preparation/bootstrap
  minutes: 45
- id: interactive
  title: Setup/Interactive
  minutes: 45
- id: feature
  title: Feature development and acceptance
  minutes: 180
- id: evaluate
  title: Evaluator controls and initial full evaluation
  minutes: 30
- id: repairs
  title: At most two repairs and complete reruns, 45 minutes each
  minutes: 90
- id: external
  title: External-image lifecycle including local cleanup
  minutes: 15
- id: final
  title: Final regression/archive
  minutes: 30
- id: cleanup
  title: Cleanup
  minutes: 30
steps:
