    expected: |-
      Package hash/version and matching public documentation identify the release; no development build, editable install, local wheel or Booley-source execution/import.
    authority_ref: https://github.com/boldaxolotl/booley/blob/b163fd1f45b76f3950005678e500e695232832fb/qa/handoff/uart.md
    evidence: |-
