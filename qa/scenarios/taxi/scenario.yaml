inputs:
- id: release
  kind: pre-run
  value: |-
    Exact immutable booley-rtl build, package SHA-256, source commit, matching docs and runtime image digest. A published release or unreleased candidate artifact is allowed; no floating reference, editable install or source-checkout execution/import.
  source: https://github.com/boldaxolotl/booley
  verification: Record version, source commit, executable/import origin, package hash, documentation identity and image payload provenance before work.
- id: upstream
  kind: git
  value: cc70b270b910d369ab1ad7b3855e76399fd461f1
  source: https://github.com/fpganinja/taxi/tree/cc70b270b910d369ab1ad7b3855e76399fd461f1
  verification: Verify exact object, clean source and per-file hashes; retain before preparation.
authority:
- |-
  Act only inside declared run-owned Projects, branches, fixture roots and runtimes; ledger every resource before mutation.
- |-
  Baseline source pins are immutable. Later edits require the attached prompt/Ticket scope; retain accepted Ticket outputs and discard temporary faults and Interactive experiments as prescribed.
- |-
  No external push, issue submission or permanent Booley repair. No source inspection before observing a product failure. No private internals as product proof.
- |-
  Keep credentials outside Projects and evidence; preserve borrowed installations, credentials, shared images/caches and unrelated state.
- |-
  Recovery stays within this live run and phase allowance; no Scenario Operator resume or replay. Retain failures, classify missing work blocked and enter cleanup on time.
budget:
  deadline_minutes: 480
  cleanup_minutes: 15
  contingency_minutes: 15
  cleanup_start_minutes: 465
  final_regression_start_minutes: 435
phases:
- id: prepare
  title: Preparation, Project Initialization, derived image and complete Setup
  minutes: 75
- id: baseline
  title: Doctor, Target resolution and clean continuity
  minutes: 60
- id: interactive
  title: Interactive Mode, FST/B-Wave and allocated inventory probes
  minutes: 45
- id: submodules
  title: Disposable submodule companion Project
  minutes: 40
- id: ticket1
  title: Ticket 1 including the complete 7-of-8 mutation campaign
  minutes: 100
- id: ticket2
  title: Seed proof and Ticket 2
  minutes: 100
- id: final
  title: Complete final regression
  minutes: 30
- id: cleanup
  title: Cleanup
  minutes: 15
steps:
- id: inputs.pin
  phase: prepare
  action: Fresh direct clone `fpganinja/taxi@cc70b270b910d369ab1ad7b3855e76399fd461f1` on a run-owned local branch.
  checks:
  - id: inputs.pin
    capabilities:
    - D-03
    stimulus: Fresh direct clone `fpganinja/taxi@cc70b270b910d369ab1ad7b3855e76399fd461f1` on a run-owned local
      branch.
    expected: Fresh direct clone `fpganinja/taxi@cc70b270b910d369ab1ad7b3855e76399fd461f1` on a run-owned local
      branch.
    authority_ref: https://github.com/boldaxolotl/booley/blob/b163fd1f45b76f3950005678e500e695232832fb/qa/handoff/taxi.md
    evidence: Exact commit, initial clean status and tree hashes.
    capture: evidence/taxi-10g-mac-port-evolution.inputs.pin
- id: inputs.no-wrapper
  phase: prepare
  action: Use direct Taxi clone, not consumer wrapper. Taxi has no submodules.
  checks:
  - id: inputs.no-wrapper
    capabilities:
    - D-03
    stimulus: Use direct Taxi clone, not consumer wrapper. Taxi has no submodules.
    expected: Use direct Taxi clone, not consumer wrapper. Taxi has no submodules.
    authority_ref: https://github.com/boldaxolotl/booley/blob/b163fd1f45b76f3950005678e500e695232832fb/qa/handoff/taxi.md
    evidence: Repository topology and gitlink inventory.
    capture: evidence/taxi-10g-mac-port-evolution.inputs.no-wrapper
  requires:
  - inputs.pin
- id: inputs.symlink
  phase: prepare
  action: |-
    Preserve committed `src/eth/lib/taxi` symlink to `../../../`; resolve real sources without requiring a functional host symlink on Windows.
  checks:
  - id: inputs.symlink
