shared_pre_run_requirements:
- Permission and capacity for admission-time `booley bootstrap` and execution-time `booley init`; managed images and toolchains created by them need not pre-exist
configured_scenarios:
- id: taxi-ubuntu-codex-cli
  required: true
  parameters:
    host_os: Ubuntu 26.04
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Codex
    interactive_mode_client: native CLI
    ticket_mode_backend: Codex
  pre_run_requirements:
  - Exact published package/release docs and immutable image provenance
  - Native host OS; at least 6 GB Docker free storage plus artifact-root headroom
  - Provider/auth class readiness without secret values
  - Declared authority and owned fixture roots
  check_sets:
  - taxi-core
  exclusions: []
- id: taxi-ubuntu-codex-vscode
  required: true
  parameters:
    host_os: Ubuntu 26.04
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Codex
    interactive_mode_client: VS Code Codex extension
    ticket_mode_backend: Codex
  pre_run_requirements:
  - Exact published package/release docs and immutable image provenance
  - Native host OS; at least 6 GB Docker free storage plus artifact-root headroom
  - Provider/auth class readiness without secret values
  - Declared authority and owned fixture roots
  - Actual VS Code runtime attachment, MCP and WCP with qualified rendered screenshot observer
  check_sets:
  - taxi-core
  - taxi-gui
  exclusions: []
- id: taxi-windows-codex-cli
  required: true
  parameters:
    host_os: Windows with Docker Desktop WSL2
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Codex
    interactive_mode_client: native CLI
    ticket_mode_backend: Codex
  pre_run_requirements:
  - Exact published package/release docs and immutable image provenance
  - Native host OS; at least 6 GB Docker free storage plus artifact-root headroom
  - Provider/auth class readiness without secret values
  - Declared authority and owned fixture roots
  check_sets:
  - taxi-core
  exclusions: []
- id: taxi-windows-codex-vscode
  required: true
  parameters:
    host_os: Windows with Docker Desktop WSL2
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Codex
    interactive_mode_client: VS Code Codex extension
    ticket_mode_backend: Codex
  pre_run_requirements:
  - Exact published package/release docs and immutable image provenance
  - Native host OS; at least 6 GB Docker free storage plus artifact-root headroom
  - Provider/auth class readiness without secret values
  - Declared authority and owned fixture roots
  - Actual VS Code runtime attachment, MCP and WCP with qualified rendered screenshot observer
  check_sets:
  - taxi-core
  - taxi-gui
  exclusions: []
inputs:
- id: release
  kind: pre-run
  value: |-
    Exact immutable booley-rtl build, package SHA-256, source commit, matching docs and runtime image digest. A published release or unreleased candidate artifact is allowed; no floating reference, editable install or source-checkout execution/import.
