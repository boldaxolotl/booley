- id: setup.artifact
  phase: prepare
  action: Verify exact immutable installed package/source/docs/image identities and pinned Verilator v5.052 ea338be98e1e838d3518809ce8899f85a009963c.
    Record actual selected provider/SDK/executable identities; no source-checkout imports.
  checks:
  - id: setup.artifact
    capabilities:
    - PRODUCT-ARTIFACT-INSTALLATION
    - EDA-VERILATOR-SIMULATION
    stimulus: Verify exact immutable installed package/source/docs/image identities and pinned Verilator v5.052
      ea338be98e1e838d3518809ce8899f85a009963c. Record actual selected provider/SDK/executable identities; no source-checkout
      imports.
    expected: Verify exact immutable installed package/source/docs/image identities and pinned Verilator v5.052
      ea338be98e1e838d3518809ce8899f85a009963c. Record actual selected provider/SDK/executable identities; no source-checkout
      imports.
    authority_ref: https://github.com/boldaxolotl/booley/blob/main/docs/user/FLOW_REFERENCE.md#native-coverage-campaigns
    evidence: 'Exact CLI argv/MCP request, exit/envelope, timestamps, Target/tests and source/build/runtime/model
      identities; hashes of native per-run data, Campaign/Simulation and relevant Criteria snapshots. For Analyst
      retain actual transcript, bounded tool responses and audit. Independent oracle compares raw native data with
      normalized points and fixed expected operands; source rollups only for line/branch/expression/toggle, overall
      rollups for cover_property. For faults preserve the concrete mutation or consumed syscall/provider handshake
      before restoration. Specific result to demonstrate: Verify exact immutable installed package/source/docs/image
      identities and pinned Verilator v5.052 ea338be98e1e838d3518809ce8899f85a009963c. Record actual selected provider/SDK/executable
      identities; no source-checkout imports.'
    capture: evidence/coverage-analysis.setup.artifact
  timeout_minutes: 10
