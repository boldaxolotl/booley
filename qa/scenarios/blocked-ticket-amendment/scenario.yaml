format_version: 1
scenario_id: blocked-ticket-amendment
title: Human-approved amendment of a blocked Ticket
source: https://github.com/boldaxolotl/booley/blob/main/src/booley/data/skills/booley-ticket-triage/steps/02-blocked.md
check_sets:
- id: amendment-core
  checks:
  - fixture.measurement
  - ticket.blocked
  - preview.readonly
  - preview.stale
  - preview.restore
  - apply.threshold
  - apply.participants
  - resume.continuity
  - resume.acceptance
- id: amendment-boundaries
  checks:
  - reject.tightening
  - reject.criterion-removal
  - reject.target-change
  - reject.build-control-change
  - scope.protected
  - optional.last
  - scope.existing
  - scope.new
  - optional.missing-explanation
  - optional.explained-finalization
- id: amendment-finish
  checks:
  - final.records
  - cleanup.owned
shared_pre_run_requirements:
- An immutable installed product artifact containing the blocked-Ticket amendment, its full source commit, matching public documentation, and runtime image digest; no editable source install.
- Docker and Verilator in the issued Session Runtime, sufficient storage, and working authentication for the selected Ticket backend. Record identities without credential bytes.
- A live Human Maintainer available to approve each exact before/after proposal. An operator or Developer Agent cannot fabricate that approval.
- Authority over three disposable Projects and Tickets, their branches/workspaces, runtime processes, and owned temporary files. No remote publication or cleanup of borrowed resources.
- Preserve the literal 438-cycle workload, initial 400-cycle ceiling, approved 450-cycle ceiling, and exact selected Target/test. Do not calibrate thresholds during the Run.
configured_scenarios:
- id: blocked-ticket-amendment-ubuntu-codex-cli
  required: true
  parameters:
    host_os: Ubuntu 24.04
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Codex
    interactive_mode_client: native CLI
    ticket_mode_backend: Codex
  pre_run_requirements:
  - Record the exact Codex CLI, SDK, and model identities before admission.
  check_sets: [amendment-core, amendment-boundaries, amendment-finish]
  exclusions: []
- id: blocked-ticket-amendment-ubuntu-claude-cli
  required: true
  parameters:
    host_os: Ubuntu 24.04
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Claude
    interactive_mode_client: native CLI
    ticket_mode_backend: Claude
  pre_run_requirements:
  - Record the exact Claude CLI, SDK, and model identities before admission.
  check_sets: [amendment-core, amendment-boundaries, amendment-finish]
  exclusions: []
- id: blocked-ticket-amendment-windows-codex-cli
  required: true
  parameters:
    host_os: Windows with Docker Desktop WSL2
    cpu_architecture: x86-64
    native_host: true
