      ea338be98e1e838d3518809ce8899f85a009963c. Record actual selected provider/SDK/executable identities; no source-checkout
      imports.
    authority_ref: https://github.com/boldaxolotl/booley/blob/main/docs/user/FLOW_REFERENCE.md#native-coverage-campaigns
    evidence: 'Exact CLI argv/MCP request, exit/envelope, timestamps, Target/tests and source/build/runtime/model
      identities; hashes of native per-run data, Campaign/Simulation and relevant Criteria snapshots. For Analyst
