    stimulus: Preserve Simulation Campaign Manifest bytes before the first work item completes and after Simulation Campaign completion; decode its strict identity, suite, workload, and ordered work items and run the read-only validator.
    expected: Simulation Campaign Manifest bytes never change; schema, exact Target, Required Simulation Suite, workload fingerprint and ordered items are complete; `summary.json` and `simulation.json` authenticate and point to that same manifest.
    authority_ref: https://github.com/boldaxolotl/booley/blob/main/docs/user/FLOW_REFERENCE.md#sim
