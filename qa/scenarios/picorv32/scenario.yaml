- id: campaign.interrupted-resume
  phase: ticket2
  action: Interrupt the full serial suite after one durable result and resume its exact manifest.
  checks:
  - id: campaign.interrupted-resume
    capabilities:
    - SIMULATION-CAMPAIGN
    stimulus: Run `quick`, `slow`, `tail`; after `quick/result.json` commits and the `slow` attempt starts, externally terminate the owning Booley process, prove process-tree death, then invoke only `--resume-from` with the printed exact manifest path.
    expected: The completed `quick` result bytes and attempt count remain unchanged; the interrupted `slow` item receives a new attempt, pending `tail` runs afterward, and the resumed Simulation Campaign completes in original manifest order.
    authority_ref: https://github.com/boldaxolotl/booley/blob/main/docs/user/FLOW_REFERENCE.md#sim
    evidence: Exact initial/resume argv and exits, termination/recovery timeline, process evidence, manifest/result digests, before/after attempt-directory listings, regenerated summary, both compatibility reports, and raw Icarus logs.
    capture: evidence/picorv32-published-demo-continuity.campaign.interrupted-resume
  requires:
  - campaign.manifest-authority
  timeout_minutes: 15
- id: campaign.workload-mismatch
  phase: ticket2
  action: Refuse source and Required Simulation Suite drift before resuming an interrupted Simulation Campaign.
  checks:
  - id: campaign.workload-mismatch
    capabilities:
    - SIMULATION-CAMPAIGN
    stimulus: Against a preserved interrupted Simulation Campaign, separately change one owned `campaign_tb.sv` byte and one copied `tests.toml` declaration; attempt exact resume after each change, then restore exact bytes and resume.
    expected: Each drift exits 2 with the precise named mismatch and creates no attempt; byte-exact restoration makes the same manifest resumable and it completes successfully.
    authority_ref: https://github.com/boldaxolotl/booley/blob/main/docs/user/FLOW_REFERENCE.md#sim
    evidence: Before/mutated/restored source and catalog bytes/digests, exact resume argv/exits/diagnostics, attempt listings proving no mutation on rejection, final results/summary and compatibility report.
    capture: evidence/picorv32-published-demo-continuity.campaign.workload-mismatch
  requires:
  - campaign.interrupted-resume
  timeout_minutes: 15
