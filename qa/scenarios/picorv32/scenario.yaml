shared_pre_run_requirements:
- Permission and capacity for admission-time `booley bootstrap` and execution-time `booley init`; managed images and toolchains created by them need not pre-exist
configured_scenarios:
- id: picorv32-ubuntu-codex-cli
  required: true
  parameters:
    host_os: Ubuntu 26.04
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Codex
    interactive_mode_client: native CLI
    ticket_mode_backend: Codex
  pre_run_requirements:
  - Exact published package/release docs and immutable image provenance
  - Native host OS; at least 6 GB Docker free storage plus artifact-root headroom
  - Provider/auth class readiness without secret values
  - Declared authority and owned fixture roots
  - Approved Vivado 2025.2 installation and exact Project Grant
  - >-
    Pre-approved Project Setup policy: enable sim, lint, synth and fpga;
    merge-refresh Project guidance; keep all compatible Specialists enabled;
    skip native parity; and use file-only feedback. Preserve the hidden
    footprint, stealth-authored cores, native-core isolation and RISC-V
    sandbox; use this Configured Scenario's declared provider/auth policy. Do
    not repeat the setup interview. After initialization, create the paired
    run-owned outer and project-data Ticket destination branches, commit the
    authorized project-data setup changes to the project-data destination
    branch, and prove both destination branches clean before either Ticket
    Create invocation.
  check_sets:
  - picorv32-core
  - picorv32-ubuntu
  - picorv32-codex
  - picorv32-ubuntu-codex
  - picorv32-simulation-campaign
  exclusions: []
- id: picorv32-ubuntu-codex-vscode
  required: true
  parameters:
    host_os: Ubuntu 26.04
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Codex
    interactive_mode_client: VS Code Codex extension
    ticket_mode_backend: Codex
  pre_run_requirements:
  - Exact published package/release docs and immutable image provenance
  - Native host OS; at least 6 GB Docker free storage plus artifact-root headroom
  - Provider/auth class readiness without secret values
  - Declared authority and owned fixture roots
  - Actual VS Code Sandbox Attachment, MCP and WCP with qualified rendered screenshot observer
  - Approved Vivado 2025.2 installation and exact Project Grant
  check_sets:
  - picorv32-core
  - picorv32-ubuntu
  - picorv32-codex
  - picorv32-ubuntu-codex
  - picorv32-gui
  - picorv32-codex-gui
  exclusions: []
