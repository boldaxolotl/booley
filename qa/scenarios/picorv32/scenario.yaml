- id: doctor.deep
  phase: prepare
  action: |-
    Qualify the pinned PicoRV32 deep Doctor baseline after plain Doctor. First run `booley doctor --deep` without the Scenario waiver and retain its report plus the `synth_core` diagnostics. Continue only when the sole active warning is the reviewed identity `flow.synth-deep-warning:synth_core`, its underlying diagnostics are attributable to the pinned upstream RTL/toolchain, and there are no failures. Compare pre-waiver and final warning representatives with the fixture's stable signature (tool, code, category, count and meaningful message content, excluding generated instance names), not the raw OpenROAD message SHA-256. Prove that a genuinely changed message fails this comparison before installing the waiver. Merge the exact unexpired, identity-bound Scenario waiver into `.booley_project/doctor-waivers.toml` without replacing other reviewed entries, then rerun `booley doctor --deep` and prove the intended waiver still matches.
  checks:
  - id: doctor.deep
    capabilities:
    - DOCTOR-DIAGNOSTICS
    stimulus: |-
      Run the pre-waiver deep Doctor and inspect the selected `synth_core` Flow diagnostics. Only after proving that `flow.synth-deep-warning:synth_core` is the sole active warning for the pinned PicoRV32 source and recorded sv2v/Yosys/OpenROAD identities, compare pre-waiver and final warning representatives with the stable signature of `fixture_validation.py`; a changed code, category, count or meaningful message must fail, while generated instance-name bytes may differ. Exercise a changed-warning negative case and the exact intended waiver match, then install the Scenario-owned waiver with exact check, subject, reason, and expiry while preserving every existing entry; rerun deep Doctor against otherwise unchanged inputs.
    expected: |-
      The pre-waiver report has no failures and no active warning outside the reviewed `flow.synth-deep-warning:synth_core` identity. The final report exits zero, shows that exact finding as `WAIVED`, and has zero unwaived active warnings and zero failures. Stable warning signatures match across the pre-waiver and final reports even when generated instance-name bytes differ; a changed code, category, count, meaningful message, additional warning, failure, stale/missing/broadened waiver, or drift in the pinned source/tool identities fails the Check. Raw warning count and raw message SHA-256 alone are never pass conditions.
    authority_ref: https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#doctor-waivers-doctor-waiverstoml
    evidence: |-
      Separate unmodified pre-waiver and final `last.json`/`last.log` copies with command exits and all selected deep checks; the installed waiver text/hash, exact `check` and `subject`, reason, expiry and proof it is unexpired; complete `synth_core` diagnostics and `doctor-warning-comparison` fixture output proving stable warning signatures, no changed or additional warning, and a tested rejection of a genuinely changed warning; pinned Project/upstream commits plus Booley, sv2v, Yosys and OpenROAD identities; before/after Project configuration and clean final report.
    capture: evidence/picorv32-published-demo-continuity.doctor.deep
