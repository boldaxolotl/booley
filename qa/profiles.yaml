- id: gui-ubuntu-codex
  required: true
  claim: Actual supported VS Code client and rendered waveform integration
  runs:
  - id: picorv32-ubuntu-codex
    scenario_id: picorv32-published-demo-continuity
    os: Ubuntu 24.04
    architecture: x86-64
    native_host: true
    provider: Codex
    interactive_client: VS Code Codex extension
    ticket_backend: Codex
    capability_probes:
    - Exact published package/release docs and immutable image provenance
    - Native host OS, Docker/storage and artifact-root capacity
    - Provider/auth class readiness without secret values
    - Declared authority and owned fixture roots
    - Actual VS Code runtime attachment, MCP and WCP with qualified rendered screenshot observer
    - RISC-V image/toolchain; at least 21 GB Docker free storage plus artifact headroom
    - Approved Vivado 2025.2 installation, exact Project Grant and controlled license relay authority
