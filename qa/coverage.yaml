  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#what-the-offer-looks-like-ask-and-email
  contract: |-
    `feedback-file-only`: unattended report generation → file only/no outbound send. `feedback-redact`: benign planted private-like fixture → exact intended redaction in preview. `feedback-token`: approved preview token then rerender changed content → old token rejected. `feedback-export`: explicit local export → preview-equivalent file. `feedback-block-submit`: dry-run/unconfirmed submission → nothing sent. `feedback-off`: off mode → no outbound offer.
    Exact sanitized preview/export and confirmation metadata without secrets; actual issue/mail send remains outside these Checks.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: DOCUMENTATION-USABILITY
  title: Documentation usability
  sources:
  - https://github.com/boldaxolotl/booley/issues/376#issuecomment-5596872672
  contract: |-
    `docs-contract`: each step follows released README/Setup/Usage/Config/Flow/EDA/Troubleshooting/help/skills → sufficient coherent public route or specific Finding with observation first. `docs-recovery`: documented recovery after seeded fault → user can resume from named checkpoint without hidden maintainer knowledge.
    Frozen public sources, first observation timestamp, later verification source if used, exact missing/contradictory instruction.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
