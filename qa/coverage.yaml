format_version: 1
capabilities:
- id: PRODUCT-ARTIFACT-INSTALLATION
  title: Product artifact installation
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/README.md#installation
  contract: |-
    `install`: install the exact declared `booley-rtl` artifact in an isolated pipx environment and launch from a new shell → metadata, executable, package provenance, source identity and version agree. The artifact may be a published release or an immutable unreleased candidate. `prerequisite`: omit/age one prerequisite in disposable host fixture → named rejection before mutation. `pip-distro`: on applicable externally-managed distro attempt documented pip route → documented rejection.
    Package metadata, artifact hash/source identity, executable resolution, pre/post owned-state snapshots. `prerequisite-recovery`: supply prerequisite and repeat readiness → success without orphan state. `pip-recovery`: use documented isolated route → same declared build ready. Every Configured Scenario separately records at least 6 GB Docker free space plus artifact-root headroom before provisioning.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: HOST-BOOTSTRAP
  title: Host bootstrap
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/SETUP.md#host-bootstrap--host
  contract: |-
    `pending`: bootstrap check-only before reconciliation → rc1 and no mutation. `automatic`: plain init without prior bootstrap → managed resources reconciled. `ready`: check-only afterward → ready without mutation. `idempotent`: repeat bootstrap → stable identities. `force-repair`: safely stale one run-owned managed resource and force → repaired resource, preserved caches/user sentinel.
    Before/after resource identities, image/PDK/skill links and user-file hashes; `repair-ready`: subsequent check-only succeeds.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: PROJECT-INITIALIZATION
  title: Project initialization
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/SETUP.md#initialize-the-project--host
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/TROUBLESHOOTING.md#windows-first-run-problems
  contract: |-
    `init-repeat`: repeat plain init → no unintended file/spec drift. `init-check`: check-only on stale disposable state → reports work without mutation. `init-force`: force reconcile owned generated state → issued configuration restored, user sentinel intact. `seed`: init with declared seed → seeded policy/config appears. `skip-credentials`: initialize with skip flag → no credential mutation. `location-guard`: invoke host-only init inside runtime → actionable rejection. `provider`: select each provider in separate declared compatibility run → issued auth/client policy matches selection.
    Generated config/devcontainer, sanitized policy, hashes. Windows: `lf-auto` introduces clean CRLF fixture → local Git policy and LF reconciliation; `lf-compat` repeats with compatibility flag → accepted; `lf-dirty`, `lf-protected`, `lf-hardlink` each introduces named unsafe file class → refusal without changed bytes. `lf-recovery`: remove unsafe fixture condition and retry → normalized safe file.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: PROJECT-SCAFFOLDING
  title: Project scaffolding
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/SETUP.md#what---scaffold-adds
  contract: |-
    `scaffold`: use accepted UART scaffold choices → documented .core, TB, lint and configuration files appear with exact selected tools. `scaffold-repeat`: rerun initialization → preserves authored files and stable targets.
    Scaffold options, generated tree manifest, initial Doctor/Target results; do not claim every scaffold cross-product.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: AGENT-AUTHENTICATION
  title: Agent authentication
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/USAGE.md#auth--billing
  contract: |-
    `auth-store`, `auth-stdin`: independently store disposable credential through documented forms → status identifies provider/auth class without secret. `auth-precedence`: configure subscription/API/automatic selection in fixtures → reported selected class follows policy. `auth-clear`: clear disposable store → status unconfigured. `auth-secret-boundary`: inspect Project/log evidence → no credential material.
    Redacted status and paths only, no token bytes. `auth-recovery`: restore disposable credential → ready; borrowed real credential remains byte-identical and unread into evidence.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: SESSION-RUNTIME-LIFECYCLE
  title: Session Runtime lifecycle
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/USAGE.md#entering-the-session-runtime-without-vs-code
  - |-
    https://github.com/boldaxolotl/booley/blob/main/docs/user/TROUBLESHOOTING.md#vs-code-says-a-mount-config-is-invalid-while-reopening-the-container
  contract: |-
    `runtime-up`: absent runtime→up/status/validate → running issued spec. `enter-success`: child returns zero → zero. `enter-failure`: child returns nonzero → same nonzero. `interrupt`: interrupt supervised child with descendant → signal semantics preserved and descendants gone. `refresh`: change permitted image/spec then refresh → new immutable identity. `refresh-rollback`: inject bounded replacement validation failure → old runtime restored. `refresh-vscode`: try refreshing VS Code-owned runtime → refusal, runtime unchanged. `runtime-down`: down → absent/stopped and no owned descendants.
    Runtime IDs/spec digest/process listing before/after. `runtime-retry`: repeat up/enter after interruption → usable clean runtime on both OSes. VS Code: `legacy-replace` exactly one authenticated legacy container → only it replaced; `legacy-refuse-ambiguous`, `legacy-refuse-foreign`, `legacy-refuse-headless`, `legacy-refuse-multiple` → each refused with all other identities intact; `legacy-poststop-failure` → exact restart command after validation failure; `legacy-restart` → supplied command restores usable runtime, named volumes unchanged.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: PROJECT-INVENTORY
  title: Project inventory
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/USAGE.md#cli-reference
  contract: |-
    `inventory-import`: import bounded disposable root containing directory symlink → only explicitly bounded real roots remembered. `inventory-views`: list human/JSON → same exact roots/Grants. `inventory-missing`: move owned root aside → missing root retained. `forget-granted`: forget granted root → rejected. `forget-revoked`: revoke then forget → exactly that root removed.
    Inventory snapshots and import tree; restore moved root before ledger cleanup, foreign roots unchanged.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: HOST-EDA-PROVISIONING
  title: Host EDA provisioning
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#commercial-eda-provisioning
  contract: |-
    `installation-crud`: register/list/show approved exact installation under run-unique name → canonical identity/version stable. `grant`: grant exact canonical Project → inventory shows exact relationship. `mount`: start runtime → fixed `/opt/booley-eda/vivado` read-only mount and executable version. `grant-denied`: revoke Grant then request runtime/tool → authority failure, no mount. `grant-recovery`: restore Grant → same mount usable. `installation-cleanup`: revoke/remove owned registration → absent, installation bytes untouched.
    Host registry snapshots, runtime mount metadata, write-rejection check, actual FPGA report. Windows expected not runnable only for platform-scoped portions.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: EDA-LICENSE-POLICY
  title: EDA license policy
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/SUPPORTED-EDA-TOOLS.md#vivado-host-provisioning-policy
  contract: |-
    `profile-crud`: register/list/show disposable License Profile → same safe identity. `profile-attach`: attach to exact Grant → runtime policy matches authorized destination. `relay-isolation`: controlled relay infrastructure attempts unapproved destination → blocked. `relay-failure`: make approved controlled destination unavailable → precise diagnostic without leaked secret. `relay-recovery`: restore controlled endpoint → approved route usable. `profile-cleanup`: detach/remove owned profile and relay → no owned resources remain.
    Redacted registry/Grant/runtime policy, destination and cleanup evidence. Actual paid checkout/accounting/concurrency/return are optional experimental checks with per-run site authority; never inferred from relay success.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. Paid-seat observations remain optional experimental with site authority; common CRUD is supported.
- id: DOCTOR-DIAGNOSTICS
  title: Doctor diagnostics
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/USAGE.md#first-verify-your-setup
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#doctor-waivers-doctor-waiverstoml
  contract: |-
    `doctor-plain`, `doctor-deep`: run separately → current structured last.json and complete last.log, intended selected checks. `doctor-warning`: benign warning fixture → actionable warning. `waiver-valid`: add explicit unexpired matching waiver → warning waived. `waiver-expired`, `waiver-stale`: expire/change warning identity separately → waiver no longer applies. `failure-not-waivable`: hard config failure with waiver → remains failure. `health-stale`: change config → freshness reports stale. `doctor-recovery`: restore config/run Doctor → fresh clean health.
    Separate report/log copies before overwrite, waiver text with expiry, config diffs. Deep Doctor retains manually suggested FPGA command rather than silently claiming FPGA execution.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: PRODUCT-UPGRADE
  title: Product upgrade
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/TROUBLESHOOTING.md
  contract: |-
    `upgrade-pending`: create Project using immediately preceding published release then install the exact declared target build → pending review identifies endpoints. The target may be a published release or an immutable unreleased candidate. `upgrade-heal`: documented heal/health/image reconciliation → current declared payload and clean health. `upgrade-ack`: acknowledge exact verified target → no pending change.
    Preceding release and target-build package identities, image payloads, health reports and upgrade state before/after. No acknowledgement following unsuccessful repair.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: HOST-POLICY
  title: Host policy
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#host-configuration-configtoml
  contract: |-
    `config-defaults`: absent disposable host config → documented defaults. `config-idle`, `config-cap`, `config-egress`: separately override each supported field → observed timeout, cross-Project cap, and allowed hostname. `config-denied-egress`: undeclared host → blocked. `config-invalid-scheme`, `config-invalid-path`, `config-invalid-port`, `config-invalid-ip`, `config-invalid-wildcard`, `config-invalid-key`: each input → validation rejection before bootstrap mutation. `config-preserve`: successful and rejected reads → byte-identical host config. `config-recovery`: restore valid policy → bootstrap succeeds.
    Policy hashes, admission timestamps/runtime counts, controlled network results and owned-resource snapshots; no unrelated external targets.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: LOCAL-FIRST-OPERATION
  title: Local-first operation
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/FEATURES.md#open-source-and-local-first
  - https://github.com/boldaxolotl/booley/blob/main/docs/internals/ARCHITECTURE.md#security--trust-model
  contract: |-
    `license-locality`: inspect package license metadata and generated state/artifact paths → Apache-2.0 and local persistence. `route-policy`: compare observed provider/relay/notification/egress routes to declared policy → each external route explicitly authorized; undeclared route blocked.
    Package metadata, local path manifest, sanitized route policy and assessment results; link SECURITY-RUNTIME-ISOLATION evidence rather than treating local-first as offline providers.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: PROJECT-SETUP
  title: Project setup
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/SETUP.md#porting-an-existing-project-plan-then-execute
  - https://github.com/boldaxolotl/booley/blob/main/src/booley/data/skills/booley-setup/SKILL.md
  contract: |-
    `setup-plan`: invoke published setup port/new route → one complete approved plan before changes. `setup-conformance`: compare resulting config/cores/guidance to plan → each deviation explicit. `setup-native`: execute accepted native parity comparison → baseline and port result compared. `setup-findings`: invoke required Findings handoff → retained local report. `setup-selector-docs`: compare public selector lists → mismatch retained as docs Finding if present.
    Approved plan, public route citations, generated diff, native logs and Finding record; no source-assisted workaround before capture.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: TARGET-CATALOG
  title: Target catalog
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/src/booley/data/cheatsheet.md#targets
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#target-authoring
  contract: |-
    `target-views`: list/filter/detail/JSON/MCP same targets → same qualified identities and typed values. `target-qualified`: invoke collision fixture with qualified name → exact core selected. `target-ambiguous`: bare collision → rejected. `target-refresh`: edit owned core then refresh → new target values visible. `target-parameters`: execute two declared Targets with different values → respective values appear in reports. `target-override`: supply invented per-call parameter override → rejected.
    Core manifests, discovery outputs, resolved build inputs; `target-recovery`: restore valid qualified selector → Flow completes with expected identity.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: TARGET-SELECTION
  title: Target selection
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#target-authoring
  contract: |-
    `target-axes`: discover authored sim/lint/synth/fpga naming and native vendored target → valid names retained. `doctor-selection`: deep Doctor with selected/nonselected targets → only selected targets run. `selftest-hidden`: ordinary listing → bad selftest absent; deep Doctor → intended selftest evidence present.
    Listings and per-target Doctor reports; no claim that hidden selftest is ordinary public discovery.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: SIMULATION-TEST-PROTOCOL
  title: Simulation test protocol
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#simulation--passfail-sentinels-flowssim
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#tests-teststoml
  contract: |-
    `sentinel-pass`, `sentinel-fail`, `sentinel-both`, `sentinel-none`: fixture emits each combination → pass, fail, fail, inconclusive respectively. `test-token`: select one plusarg/getopt token → exactly named test executed. `skip-default`: default run → skipped test absent. `skip-override`: explicit selection → same test runs. `cycle-valid`: emit named count → exact parsed count. `cycle-invalid`: malformed/missing count → cannot satisfy Criterion.
    Per-test verdicts and raw logs; `sentinel-recovery` restores valid fixture → pass; malformed count is not silently zero.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: COCOTB-TEST-EXECUTION
  title: Cocotb test execution
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#cocotb-targets-python-testbenches
  contract: |-
    `cocotb-full`, `cocotb-focused`: full/focused multi-file package → expected registered tests only, version-appropriate selector. `cocotb-presentation`: compact/full display → same verdicts as retained XML/JSON. `cocotb-assertion`: deliberate test assertion → design failure. `cocotb-missing-xml`, `cocotb-truncated-xml`: separately remove/truncate owned result → inconclusive result, not pass. `cocotb-recovery`: rerun valid suite → fresh complete XML and expected verdict.
    cocotb version, module/package manifest, selection environment excluding secrets, XML/JSON and display transcripts.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: SIMULATION-EXECUTION-GUARDS
  title: Simulation execution guards
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#simulation--passfail-sentinels-flowssim
  contract: |-
    `prerun-input`: documented env/pre-run substitution/workdir stages firmware/vector → test consumes named fresh input without TB edits. `frozen-clock`: bounded frozen simulation → documented watchdog classification. `disk-budget`: bounded disposable output exceeds configured budget → killed with largest-file diagnostics. `prerun-recovery`: restore normal stimulus and rerun → fresh artifact/verdict, no surviving producer.
    Environment variable names/nonsecret values, command/workdir, staged artifact digest, kill diagnostics/process evidence.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: PROJECT-RUNTIME-IMAGE
  title: Project Runtime Image
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#sandbox-sandbox
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#advanced-setups
  contract: |-
    `derived-image`: bake pinned requirements → runtime dependency versions match image identity. `dependency-refresh`: change permitted dependency pin → stale image detected and rebuilt identity used. `runtime-offline`: attempt runtime dependency acquisition → no undeclared network install. `host-skill-readonly`: opt in disposable skill → visible but write denied. `hook-once`: new Ticket workspace with bounded hook → exactly one successful invocation; resume → no repeat. `hook-failure`: controlled nonzero hook → workspace blocked. `hook-recovery`: fix fixture and documented retry → usable workspace.
    Image/pip manifests and payload provenance, skill mount metadata, hook counter/log and workspace identity.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: RISC-V-TOOLCHAIN
  title: RISC-V toolchain
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#risc-v-toolchain-image-booley-sandbox-riscv
  contract: |-
    `riscv-tools`: inspect runtime GCC/srec_cat/dtc/Spike and offline specs → declared supported image tools ready. `riscv-firmware`: pre-run real firmware build and Spike use → fresh named firmware and expected execution evidence.
    Storage proof, versions, compile and execution logs, firmware digest; link existing Runtime Image recovery checks in this Scenario.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: VENDORED-CORE-DISCOVERY
  title: Vendored core discovery
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#flat-and-vendored-repos
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/CONFIG.md#submodules
  contract: |-
    `vendored-ignore`: invalid core behind FUSESOC_IGNORE → excluded while valid native core resolves. `many-cores`: enumerate fixture cores → exact qualified set. Submodule companion uses the complete 26-check list in [the approved companion](submodules.md), including live top-level/nested RTL dependency, fresh passing simulation, required-source absence with warm/cold builds, dependency-specific simulation failure, and exact restoration/fresh pass. The exact qualified IDs appear in the Scenario-owned check sets and Configured Scenarios.
    Vendored/core manifest and discovery output. Direct Taxi checkout has no submodules and earns no submodule credit. Companion must prove both Ticket and baseline worktrees offline and must fail simulation when required submodule RTL is missing; root-only synthesis earns no functional-dependency credit.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: CUSTOM-FLOW-EXTENSIONS
  title: Custom Flow extensions
  sources:
  - |-
    https://github.com/boldaxolotl/booley/blob/main/docs/internals/MCP-TOOLS.md#chapter-1-discovery-visibility-and-configuration
  contract: |-
    `custom-discover`: install deterministic public Custom Flow/endpoint and Criterion → advertised schema. `custom-preflight`: dry-run → validated inputs/no execution artifact. `custom-criterion`: run → report satisfies its bound custom Criterion. `custom-disabled`: disable endpoint → absent from discovery. `custom-invalid`: syntax/schema fault → Doctor identifies extension failure. `custom-recovery`: restore file/re-enable → discovery and report succeed.
    Extension fixture source, public schema, Doctor output and Criterion/report binding; never substitute custom result for built-in sim.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: INTERACTIVE-MODE
  title: Interactive Mode
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/USAGE.md#interactive-mode
  - https://github.com/boldaxolotl/booley/blob/main/docs/internals/ARCHITECTURE.md#interactive-mode
  contract: |-
    `client-session`: actual selected VS Code client calls status/targets/Flow/Specialist → runtime identity and durable interactive logs; no Ticket/Criteria created. `interactive-commit`: safe edit/commit → exact local diff/history. `bare-launch`: bare booley/chat → configured provider and Project cwd. `bare-launch-failure`: missing disposable client executable → actionable diagnostic. `bare-launch-recovery`: restore executable → native CLI launches.
    Supported-client transcript is required for client coverage; shell/MCP harness cannot replace it. Provider compatibility executions remain separate.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: MCP-JOB-CONTROL
  title: MCP job control
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/src/booley/mcp/server.py
  contract: |-
    `mcp-schema`: discover tools in each actual supported client → public argument contracts. `detached-poll`: long public job returns run_id then poll → same job terminal result. `report-timeout`: inline client timeout then report lookup → latest same durable report. `cancel-queued`, `cancel-running`: cancel each state → distinct cancelled outcome, not design/infra failure. `cancel-recovery`: new job afterward → queue usable and clean completion.
    run_id, timing, reports, queue/running snapshots and process cleanup.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: MODE-SPECIFIC-MCP
  title: Mode-specific MCP surface
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/TROUBLESHOOTING.md#an-mcp-tool-is-missing-from-mcp
  contract: |-
    `mcp-modes`: compare Interactive/Ticket discovery → submit_run_report hidden/visible respectively. `mcp-disabled`: disable one ordinary endpoint → removed and diagnostic explains policy. `mcp-restored`: re-enable → endpoint/schema restored.
    Mode/config identity and tool lists; hidden maturity tools not promoted.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: JOB-ADMISSION-CONTROL
  title: Job admission control
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/FEATURES.md#parallel-instances
  contract: |-
    `interactive-concurrency`: two read-only Interactive jobs and Ticket work → class limits respected. `interactive-priority`: queued Interactive and Ticket jobs behind active job → no preemption; Interactive admitted first, FIFO peers. `shared-tree-collision`: two controlled edits in disposable shared-tree fixture → visible shared checkout collision captured.
    Admission/start/end ordering, class configuration and distinct caller IDs; restoration diff proves fixture cleanup.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: PUBLIC-CAPABILITY-DISCOVERY
  title: Public capability discovery
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/src/booley/data/cheatsheet.md
  contract: |-
    `public-navigation`: record consulted help/cheat/MCP/skill for each step → reproducible public route. `catalog-coherence`: compare advertised Flow/Specialist names → agreement, or distinct docs failure recorded before investigation.
    Exact documentation/help snapshots matching the tested build; unavailable GUI does not erase accessible CLI documentation checks.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: SIMULATION-FLOW
  title: Simulation Flow
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/FLOW_REFERENCE.md#sim
  contract: |-
    `sim-grades`: use independently named subchecks `sim-pass`, `sim-design-fail`, `sim-inconclusive`, `sim-infra` → correct normalized result and report class. `sim-multi`: selected pass+fail+pass Targets → all attempted, strongest grade retained. `sim-elab`: elab-only → durable successful elaboration. `sim-elab-args`: add run-only argument to elab → rejected. `sim-standalone-pass`, `sim-standalone-fail`: standalone good/bad module → distinct results. `sim-elab-persistence`: successful elaboration followed by failing run → elaboration remains durable.
    sim target JSON, artifacts/logs, exact target/test lists; restored failing fixture rerun earns separate `sim-recovery`. Focus/skip/traces reuse SIMULATION-TEST-PROTOCOL/COCOTB-TEST-EXECUTION/TRACE-ARTIFACT only through named mapping.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: LINT-FLOW
  title: Lint Flow
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/FLOW_REFERENCE.md#lint
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/FEATURES.md#lint-triage
  contract: |-
    `lint-clean`, `lint-warning`, `lint-hard`, `lint-infra`: separate clean/warning/syntax/tool-availability inputs → distinct report outcomes. `lint-nonfatal-warning`: warnings configured nonfatal → rc and report passed distinction preserved. `lint-scope`: selected files → only intended scope. `lint-dedupe`: duplicate cross-Target finding → one finding with proper provenance. `lint-native-waiver`: each linter's native waiver → intended finding waived only. `lint-recovery`: restore source/tool → clean fresh result.
    Both linter versions, native waiver files, complete findings/report and filtered file lists.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: SYNTHESIS-FLOW
  title: Synthesis Flow
  sources:
  - https://github.com/boldaxolotl/booley/blob/main/docs/user/FLOW_REFERENCE.md#synth
  contract: |-
    `synth-metrics`: execute assigned mode/frontend → fresh metrics and actual tool provenance. `synth-latch`: bounded latching fixture → reported critical condition. `synth-advisory`: timing miss without hard threshold → advisory. `synth-threshold`: configured threshold violated → design failure. `synth-baseline`: compare declared baseline/candidate → numeric delta with both identities. `synth-frontend-missing`, `synth-frontend-incompatible`: distinct faults → appropriate config/execution failure. `synth-recovery`: restore supported frontend/design → valid fresh metrics.
    Yosys/OpenROAD/frontend logs and versions, SDC/default clock, selected profile/expert override, metrics/baseline recipe. No signoff claim.
  applicability: |-
    Supported outcomes under explicit Configured Scenario applicability. No hidden, planned or unsupported cross-product receives credit.
- id: FPGA-FLOW
  title: FPGA Flow
  sources:
