# Validate up to three cumulative candidates concurrently, with one PR per
# batch and no automatic retries. Before rollout, verify required checks on a
# draft-PR compatibility canary and disable strict up-to-date branch checks
# while retaining required checks and Mergify-exclusive merges.
merge_queue:
  mode: serial
  # Keep queue progress in Mergify's dashboard and checks instead of posting
  # status comments that notify every participant on each pull request.
  status_comments: none
  max_parallel_checks: 3
  queued_label: queued
  checking_label: merge-queue-checking
  dequeued_label: dequeued
  reset_on_external_merge: always

queue_rules:
  - name: default
    batch_size: 1
    # Cold-cache runtime image validation takes about 57 minutes. Keep the
    # queue bound explicit so Mergify's shorter history-derived timeout cannot
    # dequeue a healthy build before ci-required reports.
    checks_timeout: 90 minutes
    max_checks_retries: 0
    branch_protection_injection_mode: queue
    merge_method: merge
    queue_conditions:
      - base = main
      - check-success = @github-actions/ci-required
      - check-success = @github-actions/confidential-content
    # Require the same checks for queue admission and speculative candidates.
    merge_conditions:
      - base = main
      - check-success = @github-actions/ci-required
      - check-success = @github-actions/confidential-content

# Urgent incident fixes and CI fixes share one elevated tier ahead of ordinary
# work. Running checks are deliberately allowed to finish so an expedited PR
# does not discard CI time that the serial queue has already spent.
priority_rules:
  - name: urgent incident fix
    conditions:
      - label = urgent
    priority: high
    allow_checks_interruption: false
  - name: CI fix
    conditions:
      - label = ci
    priority: high
    allow_checks_interruption: false

# Agents act through an authenticated repository writer. External contributors
# submit ready PRs; a maintainer or repository agent queues them.
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
  dequeue:
    conditions:
      - sender-permission >= write
