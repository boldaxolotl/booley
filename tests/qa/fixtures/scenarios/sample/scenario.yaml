format_version: 1
scenario_id: sample
title: Release smoke
source: https://example.com/release
check_sets:
- id: sample-core
  checks:
  - baseline
  - negative
  - restored
  - removed
configured_scenarios:
- id: sample-linux-cli
  required: true
  parameters:
    host_os: Ubuntu 26.04
    cpu_architecture: x86-64
    native_host: true
    agent_provider: Codex
    interactive_mode_client: native CLI
    ticket_mode_backend: Codex
  pre_run_requirements:
  - Docker ready
  check_sets:
  - sample-core
  exclusions: []
authority:
- Owned temporary root only
inputs:
- id: release
  kind: pre-run
  value: Exact published release
  source: https://example.com/release
  verification: Record package digest
budget:
  deadline_minutes: 480
  cleanup_minutes: 20
  contingency_minutes: 15
  cleanup_start_minutes: 460
phases:
- id: work
  title: Installation
  minutes: 445
- id: cleanup
  title: Cleanup
  minutes: 20
steps:
- id: prepare
  phase: work
  action: Install the release
  checks:
  - id: baseline
    capabilities:
    - PRODUCT-ARTIFACT-INSTALLATION
    stimulus: Read the version
    expected: The installed version equals the frozen release
    authority_ref: https://example.com/release
    evidence: Version output, executable path and package digest
    capture: evidence/baseline
- id: detect
  phase: work
  action: Remove the executable
  requires:
  - baseline
  checks:
  - id: negative
    capabilities:
    - PRODUCT-ARTIFACT-INSTALLATION
    stimulus: Read the version
    expected: The installed version equals the frozen release
    authority_ref: https://example.com/release
    evidence: Version output, executable path and package digest
    capture: evidence/negative
- id: restore
  phase: work
  action: Restore exact executable
  requires:
  - baseline
  checks:
  - id: restored
    capabilities:
    - PRODUCT-ARTIFACT-INSTALLATION
    stimulus: Read the version
    expected: The installed version equals the frozen release
    authority_ref: https://example.com/release
    evidence: Version output, executable path and package digest
    capture: evidence/restored
  recovery:
    baseline: baseline
    detection:
    - negative
    instruction: Restore recorded bytes
- id: cleanup
  phase: cleanup
  action: Release owned state
  checks:
  - id: removed
    capabilities:
    - PRODUCT-ARTIFACT-INSTALLATION
    stimulus: Read the version
    expected: The installed version equals the frozen release
    authority_ref: https://example.com/release
    evidence: Version output, executable path and package digest
    capture: evidence/removed
