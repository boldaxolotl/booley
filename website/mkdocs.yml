# Project site published at https://boldaxolotl.github.io/booley/ by
# .github/workflows/pages.yml. Preview locally from this directory:
#   pip install -r requirements.txt && mkdocs serve
site_name: Booley
site_url: https://boldaxolotl.github.io/booley/
site_description: The open-source agentic RTL IDE
site_author: A.R.

# Build output stays inside website/ and is gitignored.
site_dir: _build

theme:
  name: material
  # No Google Fonts: the theme's fonts are self-hosted (see
  # stylesheets/terminal.css), so there are no third-party requests and
  # no cookie banner.
  font: false
  # Terminal look: one dark scheme, recoloured in stylesheets/terminal.css.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - content.code.copy

plugins:
  - search
  - blog:
      blog_dir: blog
      # Permanent post URLs: /blog/<slug>/, no date segments, so a post
      # keeps its link if its date is ever corrected.
      post_url_format: "{slug}"
      post_readtime: true
      archive: false
      categories: false
      # Posts marked `draft: true` render under `mkdocs serve` only and are
      # left out of the published build.
      draft_on_serve: true

extra:
  generator: false

extra_css:
  - stylesheets/terminal.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Blog: blog/index.md
  - GitHub: https://github.com/boldaxolotl/booley
