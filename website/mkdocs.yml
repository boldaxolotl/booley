# Project site published at https://booley.dev/ by
# .github/workflows/pages.yml. Preview locally from this directory:
#   pip install -r requirements.txt && mkdocs serve
site_name: Booley
site_url: https://booley.dev/
site_description: The open-source agentic RTL IDE
site_author: boldaxolotl

# Build output stays inside website/ and is gitignored.
site_dir: _build

theme:
  name: material
  # Datasheet look: overrides/base.html replaces Material's page chrome and
  # stylesheets/datasheet.css styles everything. Material stays for its blog
  # plugin. Fonts are self-hosted (no third-party requests, no cookie banner).
  custom_dir: overrides
  font: false

plugins:
  - blog:
      blog_dir: blog
      # Permanent post URLs: /blog/<slug>/, no date segments, so a post
      # keeps its link if its date is ever corrected.
      post_url_format: "{slug}"
      post_readtime: true
      archive: false
      categories: false
      # Posts marked `draft: true` render under `mkdocs serve` only and are
      # left out of the published build.
      draft_on_serve: true

# Publishes the repository's docs/user/ at /docs/<slug>/ and builds the
# Pagefind search index (ADR 0081).
hooks:
  - hooks/user_docs.py

# --strict turns these into errors: every link and heading anchor must resolve.
validation:
  links:
    anchors: warn
    unrecognized_links: warn

extra:
  generator: false

extra_css:
  - stylesheets/datasheet.css
  # Generated by illustration/build.py; do not edit by hand.
  - stylesheets/ide.css
  - stylesheets/article.css
  - stylesheets/docs.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  # Splices generated HTML (the home-page illustration) into Markdown pages.
  - pymdownx.snippets:
      base_path: [snippets]
      check_paths: true
  # Heading IDs match GitHub's, so one anchor works on both renderings;
  # website/hooks/user_docs.py fails the build if any docs heading differs.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}

nav:
  - Home: index.md
  - Demos: demos.md
  - Videos: videos.md
  - Docs: docs/index.md
  - Blog: blog/index.md
  - GitHub: https://github.com/boldaxolotl/booley
