<svg xmlns="http://www.w3.org/2000/svg" class="fd" viewBox="0 0 440 222" role="img" aria-label="Inside the Sandbox container, each agent has its own worktree holding its branch and commits: Agent 1 on fifo-depth is running synth, Agent 2 on uart-parity is running sim, Agent 3 on alu-timing is done. From the Sandbox only the LLM provider is reachable; the internet and the rest of your machine are blocked. You review the finished work and merge it into main.">
