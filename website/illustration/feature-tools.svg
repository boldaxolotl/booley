<svg xmlns="http://www.w3.org/2000/svg" class="fd" viewBox="0 0 440 176" role="img" aria-label="The agent (Claude Code or Codex) presses buttons on a Booley panel. Run buttons (sim, synth, lint, fpga) and Check buttons (waveform query, mutation test) drive the EDA tools such as Verilator, Yosys and Vivado. Review buttons (spec, bugs, protocol, security, optimization, style, testbench) go only to a separate Reviewer agent.">
