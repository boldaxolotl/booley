<svg xmlns="http://www.w3.org/2000/svg" class="arch" viewBox="0 0 1400 880" width="1400" height="880" role="img" aria-labelledby="fig2t fig2d">
  <!-- Booley architecture diagram for docs/internals/ARCHITECTURE.md. Source:
       website/illustration/architecture.svg; after editing it, run
       website/illustration/build.py, which embeds the fonts and writes
       docs/user/assets/architecture.svg. Keep the <desc> and the alt text in
       ARCHITECTURE.md in step with the drawing. -->
  <style>
    /* {{FONTS}} */
    /* Colours: the site's light datasheet tokens. Shown as an image, the diagram cannot
       follow the site's theme switch, so it stays light on its own white background. */
    .arch { --paper: #ffffff; --ink: #15191e; --ink-2: #4a525c; --rule: #8e98a3;
      --fill: #eaeef1; --fill-2: #f5f7f8; --mask: #0b5a43; --warn: #b3261e }
    .arch .bg { fill: var(--paper); }
    .arch text { font-family: "Archivo", "Arial Narrow", Arial, sans-serif; fill: var(--ink); font-stretch: 85%; }
    .arch .t { font-size: 15px; font-weight: 650; }                  /* box title */
    .arch .s { font-size: 13px; fill: var(--ink-2); }                /* box sub-label */
    .arch .b { font-size: 13.5px; }                                  /* box body line */
    .arch .b tspan.k { font-weight: 650; }                           /* emphasized name */
    .arch .e { font-size: 12.5px; fill: var(--ink-2); font-style: italic; }  /* edge label */
    .arch .ew { font-size: 12.5px; fill: var(--warn); font-style: italic; }  /* escape-hatch label */
    .arch .sbl { fill: var(--mask); font-size: 14px; font-weight: 650; font-stretch: 90%; }     /* Sandbox label */
    .arch .hl { fill: var(--ink-2); font-size: 14px; font-weight: 650; font-stretch: 90%; }     /* host label */
    .arch .bx { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
    .arch .hd { fill: var(--fill); stroke: var(--ink); stroke-width: 1.2; }  /* grey header band */
    .arch .grp { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1; }
    .arch .host { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1; }
    .arch .sandbox { fill: var(--paper); stroke: var(--mask); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .arch .ln { fill: none; stroke: var(--ink); stroke-width: 1.3; }
    .arch .lw { fill: none; stroke: var(--warn); stroke-width: 1.3; stroke-dasharray: 5 4; }
    .arch .ah { fill: var(--ink); }
    .arch .aw { fill: var(--warn); }
  </style>
  <rect class="bg" width="1400" height="880"/>
  <title id="fig2t">Booley architecture</title>
  <desc id="fig2d">On the host, Booley issues, refreshes, and reaps one Booley devcontainer Sandbox per Project folder, and VS Code attaches to it through Dev Containers. Inside the Sandbox, Developer Agent sessions (Claude Code or Codex, one per Sandbox terminal) edit the Project's checkouts: the main checkout plus one worktree per concurrent session, holding the RTL, testbenches, FuseSoC .core Targets, booley.toml, and metrics.toml. The Booley Directory keeps Common Booley State in the main checkout and Checkout Booley State per worktree. Every session calls the one MCP server. The MCP server submits each Measurement, Booley Flow, and Specialist run as a Job; the Booley Dashboard starts Standalone Jobs. Jobs are admitted against the Memory Budget: excess Jobs queue and none is preempted. Measurement (booley measure) runs the Flows on every Target that declares metrics and checks the results against its Target Metrics. A Booley Flow (sim, lint, synth, fpga, mutation) resolves the Target with FuseSoC, has Edalize or a Booley adapter build the EDA tool command, runs the EDA tools, parses their logs into metrics, and writes report.json. Specialists (the Reviewer and the Coverage Analyst) run an Agent CLI. The MCP server calls B-Wave directly, not as a Job: it queries FST Trace Artifacts, and bwave gui opens them in VaporView through the Viewer Bridge. The EDA tools are linters (Verilator, Verible), synthesis (Yosys, OpenROAD), simulators (Verilator, Icarus, with cocotb testbenches), and FPGA implementation (Vivado, registered on the host, granted to the Project, mounted read-only, with license traffic through a FlexNet relay). By default all Sandbox egress goes through the host's egress proxy to LLM APIs and allowlisted hosts; Unproxied Sandboxes skip it. The known escape hatch: the Sandbox can write the shared .git metadata, whose hooks and configuration Git on the host later runs.</desc>
  <defs>
    <marker id="f2a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0 1.5 L10 5 L0 8.5 z"/></marker>
    <marker id="f2w" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="aw" d="M0 1.5 L10 5 L0 8.5 z"/></marker>
  </defs>

