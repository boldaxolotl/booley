  <rect class="bx" x="370" y="390" width="570" height="54"/>
  <text class="t" x="384" y="411">Jobs</text>
  <text class="b" x="384" y="432">Each run reserves memory from its Resource History and starts when it fits the Memory Budget</text>
  <text class="s" x="926" y="411" text-anchor="end">excess Jobs queue; none is preempted</text>

