  <rect class="bx" x="170" y="352" width="160" height="88"/>
  <text class="t" x="250" y="375" text-anchor="middle">Egress proxy</text>
  <text class="s" x="250" y="395" text-anchor="middle">default for all</text>
  <text class="s" x="250" y="411" text-anchor="middle">Sandbox egress;</text>
  <text class="s" x="250" y="427" text-anchor="middle">Unproxied skips it</text>
  <path class="ln" d="M135 396 H170" marker-start="url(#f2a)" marker-end="url(#f2a)"/>
  <path class="ln" d="M330 396 H350" marker-start="url(#f2a)" marker-end="url(#f2a)"/>

