[package]
name = "bwave"
version = "0.2.3"
edition = "2021"

[[bin]]
name = "bwave"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fst-reader = "0.17"
fst-writer = { path = "vendor/fst-writer" }
globset = "0.4"
include_dir = "0.7"
libc = "0.2"
memchr = "2"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
profile = ["fst-writer/profile"]

[lib]
name = "bwave"
path = "src/lib.rs"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = true
