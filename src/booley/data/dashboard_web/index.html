<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booley Dashboard</title>
<link rel="stylesheet" href="/assets/dashboard.css">
<script src="/assets/dashboard.js" defer></script>
<script src="/assets/run.js" defer></script>
</head>
<body>
<header id="topbar" class="topbar" hidden>
<span class="brand">Booley Dashboard</span>
<button id="run-button" class="primary" type="button" hidden
  aria-expanded="false" aria-controls="run">Run</button>
</header>
<section id="run" class="run-form" hidden aria-label="Run a Booley Flow or Specialist">
<label>Run <select id="run-entry"></select></label>
<p id="run-problem" class="error" hidden></p>
<div id="run-fields"></div>
<ul id="run-review" class="run-review" hidden aria-label="Review"></ul>
<div class="run-command"><code id="run-command"></code>
<button id="run-copy" type="button" disabled>Copy</button></div>
<p id="run-error" class="error" hidden></p>
<div class="run-actions"><button id="run-check" type="button" disabled>Review</button>
<button id="run-submit" class="primary" type="button" disabled>Submit</button>
<button id="run-cancel" type="button">Cancel</button></div>
</section>
<main>
<div id="live"><p>Loading</p></div>
<div id="results"></div>
</main>
</body>
</html>
