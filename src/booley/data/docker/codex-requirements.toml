# Booley Sandboxes are offline except for the LLM API proxy.
# An empty allowlist means only web_search = "disabled" is permitted, even
# when Codex runs with danger-full-access inside the outer Docker sandbox.
allowed_web_search_modes = []

# The CLIs are pinned in a root-owned npm prefix; an offered upgrade could
# never install.
check_for_update_on_startup = false

# Report session lifecycle events to the Booley Dashboard (ADR 0068). Hooks
# declared here are managed: they run without per-user hook trust. The activity
# command prints nothing and always exits 0, so it can never block or alter a turn.

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 -I -S /usr/local/libexec/booley/session_activity_hook.py codex"
timeout = 3

[[hooks.PreToolUse]]
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 -I -S /usr/local/libexec/booley/session_activity_hook.py codex"
timeout = 3

# Block the T3 Code tools t3code-denied-tools.txt names (a test holds Claude's managed
# deny list equal to it). The matcher sends the hook only calls to T3 Code's two MCP
# servers, in the names Codex gives hooks. The interpreter is named by path, so a
# python3 in an agent-writable PATH directory cannot stand in for it.
[[hooks.PreToolUse]]
matcher = "^mcp__t3_code(_direct)?(_[0-9a-f]{12})?__"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 -I -S /usr/local/libexec/booley/t3code_tool_deny_hook.py"
timeout = 3

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 -I -S /usr/local/libexec/booley/session_activity_hook.py codex"
timeout = 3

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "python3 -I -S /usr/local/libexec/booley/session_activity_hook.py codex"
timeout = 3

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "python3 -I -S /usr/local/libexec/booley/session_activity_hook.py codex"
timeout = 3

[[hooks.Interrupt]]
[[hooks.Interrupt.hooks]]
type = "command"
command = "python3 -I -S /usr/local/libexec/booley/session_activity_hook.py codex"
timeout = 3

[[hooks.SessionEnd]]
[[hooks.SessionEnd.hooks]]
type = "command"
command = "python3 -I -S /usr/local/libexec/booley/session_activity_hook.py codex"
timeout = 3
