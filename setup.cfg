# mutmut configuration for the scheduled mutation campaign (deep-tests.yml).
#
# It lives here rather than in pyproject.toml because pyproject.toml's bytes
# define the published runtime base compatibility contract (see
# src/booley/data/docker/stable-base-inputs.txt): tuning the campaign there
# would rebuild and republish the Sandbox Image runtime base. mutmut ignores this file
# whenever pyproject.toml has a [tool.mutmut] table, so keep that table absent.
# setuptools reads only its own sections, so [mutmut] does not affect packaging.
#
# List values take one entry per indented continuation line.
[mutmut]
# The historical `harness/stages` package was renamed to `harness/setup`;
# keeping the stale path made the configured campaign exercise zero files.
source_paths =
    src/
only_mutate =
    src/booley/harness/setup/*.py
pytest_add_cli_args =
    -x
    -q
    --tb=no
    --no-header
pytest_add_cli_args_test_selection =
    tests/harness/
# mutmut runs the selected tests inside `mutants/`, which it seeds with only
# `src/`, `tests/`, `setup.cfg` and `pyproject.toml`. That copied pyproject
# keeps `[tool.booley] source_checkout = true`, so `import booley` treats
# `mutants/` as a Booley source checkout and requires its `VERSION`; the
# harness tests also read checkout files (docs, workflows, Sandbox Image build
# inputs). Mirror every other tracked top-level entry so `mutants/` is a
# faithful checkout. The B-Wave crate is listed per tracked child so local
# Cargo `target/` build outputs are never copied. mutmut copies single files
# without creating parent directories, so each crate directory entry precedes
# the files that live beside it.
# tests/test_pytest_configuration.py keeps this list complete.
also_copy =
    .dockerignore
    .gitattributes
    .github/
    .gitignore
    .mergify.yml
    AGENTS.md
    CHANGELOG.md
    GLOSSARY-MAP.md
    LICENSE
    README.md
    SECURITY.md
    THIRD_PARTY_NOTICES.md
    VERSION
    docs/
    qa/
    crates/bwave/benches/
    crates/bwave/dev_support/
    crates/bwave/docs/
    crates/bwave/schema/
    crates/bwave/src/
    crates/bwave/tests/
    crates/bwave/vendor/
    crates/bwave/GLOSSARY.md
    crates/bwave/Cargo.lock
    crates/bwave/Cargo.toml
    crates/bwave/fuzz/corpus/
    crates/bwave/fuzz/fuzz_targets/
    crates/bwave/fuzz/.gitignore
    crates/bwave/fuzz/Cargo.lock
    crates/bwave/fuzz/Cargo.toml
