# mutmut configuration for the scheduled mutation campaign (deep-tests.yml).
#
# It lives here rather than in pyproject.toml because pyproject.toml's bytes
# define the published runtime base compatibility contract (see
# src/booley/data/docker/stable-base-inputs.txt): tuning the campaign there
# would rebuild and republish the Sandbox Image runtime base. mutmut ignores this file
# whenever pyproject.toml has a [tool.mutmut] table, so keep that table absent.
# setuptools reads only its own sections, so [mutmut] does not affect packaging.
#
# List values take one entry per indented continuation line.
[mutmut]
# The historical `harness/stages` package was renamed to `harness/setup`;
# keeping the stale path made the configured campaign exercise zero files.
source_paths =
    src/
only_mutate =
    src/booley/harness/setup/*.py
# mutmut already passes `-x` to every stats, clean, and mutant run, so it is not
# repeated here. Stats-run output is printed only when collection fails; mutant
# workers send theirs to /dev/null, so these options add at most one formatted
# traceback per killed mutant.
# `--tb=short` is explicit because dropping `--tb=no` alone would restore mutmut's
# own `--tb=native`; `-rfE` keeps a failure summary even if `addopts` changes.
pytest_add_cli_args =
    -q
    --tb=short
    -rfE
    --no-header
    # mutants/ is not the top of a Git checkout, so this wheel test's source copy fails there;
    # it checks no harness/setup code, so it kills no mutants (maintainer decision d3092-1).
    --deselect=tests/harness/test_image_build_contracts.py::test_installed_wheel_plans_and_prepares_hybrid_graph_without_checkout_access
pytest_add_cli_args_test_selection =
    tests/harness/
# `also_copy` is not set here: the campaign generates it before `mutmut run`
# (.github/scripts/mutmut_also_copy.py, run by deep-tests.yml). mutmut seeds
# `mutants/` by default with `src/`, `tests/`, `setup.cfg` and `pyproject.toml`, but
# `import booley` there needs `VERSION` and the harness tests read docs,
# workflows and Sandbox Image build inputs, so `mutants/` must be a faithful
# checkout. The generator lists every other tracked path and never untracked
# content such as Cargo `target/` build output. Do not add the key by hand. To
# run it locally, use a fresh `git worktree` and restore setup.cfg afterwards.
