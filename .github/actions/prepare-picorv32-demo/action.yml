name: Prepare pinned PicoRV32 demo
description: Check out and prepare the CI-owned PicoRV32 demo contract

inputs:
  contract:
    description: Repository-relative path to the demo contract
    required: false
    default: .github/contracts/picorv32-demo.toml

outputs:
  ticket_slug:
    description: Slug of the installed CI-owned Ticket fixture
    value: ${{ steps.contract.outputs.ticket_slug }}

runs:
  using: composite
  steps:
    - name: Read reviewed revisions from contract
      id: contract
      shell: bash
      env:
        CONTRACT_PATH: ${{ inputs.contract }}
      run: >-
        python "${GITHUB_WORKSPACE}/.github/scripts/export_demo_contract.py"
        --contract "${CONTRACT_PATH}" >> "${GITHUB_OUTPUT}"

    # Both reviewed pins must belong to the public main branches that users
    # clone. The synthetic Ticket is installed only in this ephemeral checkout.
    - name: Check out reviewed PicoRV32 revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.contract.outputs.upstream_repository }}
        ref: ${{ steps.contract.outputs.upstream_ref }}
        path: demo
        fetch-depth: 0
        persist-credentials: false

    - name: Check out reviewed demo-project revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.contract.outputs.project_repository }}
        ref: ${{ steps.contract.outputs.project_ref }}
        path: demo/.booley_project
        fetch-depth: 0
        persist-credentials: false

    # Keep the nested project-data checkout and the core projections produced
    # by readiness checks outside the reviewed upstream checkout's status.
    # This is repository-local so validation never depends on a runner's
    # personal global ignore configuration.
    - name: Apply documented local checkout excludes
      shell: bash
      run: |
        printf '%s\n' \
          '/.booley_project' \
          '/.booley-projected-*.core' \
          >> demo/.git/info/exclude

    - name: Require reviewed revisions and materialize destination refs
      shell: bash
      run: |
        git -C demo merge-base --is-ancestor HEAD origin/main
        git -C demo/.booley_project merge-base --is-ancestor HEAD origin/main
        git -C demo branch --force main HEAD
        git -C demo/.booley_project branch --force main HEAD

    # Publishing the Acceptance Basis performs real Target discovery, so the
    # host-side installer needs Booley's production Python dependencies.
    - name: Install Booley runtime dependencies
      shell: bash
      run: >-
        python -m pip install --disable-pip-version-check --quiet
        "${GITHUB_WORKSPACE}"

    # Acceptance Basis publication runs the project's deterministic preparation
    # hook. Use the same reviewed multilib Newlib toolchain family as Booley's
    # RISC-V image so PicoRV32 can compile both rv32im firmware programs.
    - name: Install host RISC-V preparation toolchain
      shell: bash
      env:
        TOOLCHAIN_URL: ${{ steps.contract.outputs.toolchain_url }}
        TOOLCHAIN_SHA256: ${{ steps.contract.outputs.toolchain_sha256 }}
      run: |
        archive="${RUNNER_TEMP}/riscv-toolchain.tar.gz"
        tool_root="${RUNNER_TEMP}/riscv-toolchain"
        curl --proto '=https' --tlsv1.2 -fsSL "${TOOLCHAIN_URL}" -o "${archive}"
        echo "${TOOLCHAIN_SHA256}  ${archive}" | sha256sum -c -
        mkdir -p "${tool_root}"
        tar -xzf "${archive}" -C "${tool_root}" --strip-components=1
        for executable in "${tool_root}"/bin/riscv-none-elf-*; do
          helper="${executable##*riscv-none-elf-}"
          ln -sf "${executable}" "${tool_root}/bin/riscv32-unknown-elf-${helper}"
        done
        echo "${tool_root}/bin" >> "${GITHUB_PATH}"

    - name: Install CI-owned Ticket fixture into ticket-free checkout
      shell: bash
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        TICKET_FIXTURE: ${{ steps.contract.outputs.ticket_fixture }}
        TICKET_SLUG: ${{ steps.contract.outputs.ticket_slug }}
      run: >-
        git -C demo config user.name booley-ci &&
        git -C demo config user.email booley-ci@users.noreply.github.com &&
        git -C demo/.booley_project config user.name booley-ci &&
        git -C demo/.booley_project config user.email booley-ci@users.noreply.github.com &&
        python "${GITHUB_WORKSPACE}/.github/scripts/install_demo_ticket.py"
        --project-dir demo/.booley_project
        --fixture "${TICKET_FIXTURE}"
        --slug "${TICKET_SLUG}"
