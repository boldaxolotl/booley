[[common.probe]]
name = "unprivileged runtime identity"
command = '''
test "$(id -u)" -eq 1000
test "$(id -g)" -eq 1000
test "$PWD" = /work
printf 'uid=%s gid=%s workdir=%s\n' "$(id -u)" "$(id -g)" "$PWD"
'''

[[common.probe]]
name = "native C and C++ compilation"
command = '''
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
printf '%s\n' 'int main(void) { return 0; }' > "$work/main.c"
printf '%s\n' '#include <vector>' 'int main() { std::vector<int> v{0}; return v[0]; }' > "$work/main.cc"
gcc "$work/main.c" -o "$work/main-c"
g++ "$work/main.cc" -o "$work/main-cpp"
"$work/main-c"
"$work/main-cpp"
'''

[[common.probe]]
name = "EDA command diagnostics"
command = '''
iverilog -V >/dev/null 2>&1
verilator --version >/dev/null
yosys -V >/dev/null
openroad -version >/dev/null
sv2v --version >/dev/null
verible-verilog-lint --version >/dev/null
test "$(cocotb-config --version)" = "2.1.0"
test -e "$(cocotb-config --lib-name-path vpi icarus)"
'''

[[common.probe]]
name = "agent client offline diagnostics"
timeout_seconds = 120
command = '''
claude --version
claude --help >/dev/null
claude doctor >/dev/null
codex --version
codex --help >/dev/null
status=0
codex doctor --json > /tmp/codex-doctor.json || status=$?
test "$status" -eq 0 -o "$status" -eq 1
python3 -c 'import json; report = json.load(open("/tmp/codex-doctor.json")); assert report["checks"]["config.load"]["summary"] == "config loaded"'
rm -f /tmp/codex-doctor.json
'''

[standard]

[riscv]
required_commands = [
  "dtc",
  "pdftotext",
  "srec_cat",
  "spike",
  "spike-log-parser",
  "termios-xspike",
  "xspike",
  "riscv-none-elf-gcc",
  "riscv-none-elf-g++",
  "riscv32-unknown-elf-gcc",
  "riscv64-unknown-elf-gcc",
]
required_paths = [
  "/opt/riscv-docs/INDEX.md",
  "/opt/riscv-docs/riscv-abi.pdf",
  "/opt/riscv-docs/riscv-debug-specification.pdf",
  "/opt/riscv-docs/riscv-isa-manual.html",
  "/opt/riscv-docs/riscv-isa-manual.pdf",
  "/opt/riscv/lib/libcustomext.so",
  "/opt/riscv/lib/libfesvr.a",
  "/opt/riscv/lib/libriscv.so",
]

[[riscv.probe]]
name = "RISC-V multilib C and C++ links"
timeout_seconds = 180
command = '''
test "$(riscv-none-elf-gcc -print-multi-lib | wc -l)" -eq 32
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
printf '%s\n' 'int main(void) { return 0; }' > "$work/main.c"
printf '%s\n' '#include <array>' 'int main() { std::array<int, 2> v{1, 2}; return v[0] - 1; }' > "$work/main.cc"
for tuple in "rv32imc ilp32" "rv64gc lp64d"; do
  set -- $tuple
  riscv-none-elf-gcc -march="$1" -mabi="$2" -specs=nosys.specs "$work/main.c" -o "$work/c-$1.elf"
  riscv-none-elf-g++ -march="$1" -mabi="$2" -specs=nosys.specs "$work/main.cc" -o "$work/cpp-$1.elf"
done
'''

[[riscv.probe]]
name = "RV32 ISA execution under Spike"
command = '''
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
printf '%s\n' \
  '.section .text.init' '.globl _start' '_start:' \
  '  li t0, 1' '  la t1, tohost' '  sw t0, 0(t1)' '1: j 1b' \
  '.section .tohost,"aw",@progbits' '.align 6' '.globl tohost' \
  'tohost: .word 0' '.globl fromhost' 'fromhost: .word 0' > "$work/pass.S"
printf '%s\n' 'ENTRY(_start)' 'SECTIONS {' '  . = 0x80000000;' \
  '  .text : { *(.text.init) *(.text*) }' '  . = ALIGN(64);' \
  '  .tohost : { *(.tohost) }' '}' > "$work/pass.ld"
riscv-none-elf-gcc -nostdlib -nostartfiles -march=rv32imac -mabi=ilp32 \
  -Wl,-T,"$work/pass.ld" -o "$work/pass.elf" "$work/pass.S"
timeout 10 spike --isa=rv32imac "$work/pass.elf"
'''
