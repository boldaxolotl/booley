name: Confidential content

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Read queued PRs when scanning a Mergify candidate; comment and label an
  # outside PR through the issues endpoints.
  pull-requests: write
  statuses: write

jobs:
  confidential-content:
    name: confidential-content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target keeps the workflow and scanner on the trusted base
      # revision. Do not check out or execute files from the pull request.
      - name: Check out trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up trusted scanner dependency
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install authenticated encryption dependency
        run: python -m pip install -r .github/ci/requirements-scanner.txt

      - name: Fetch pull-request commit
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/confidential-content/head"
          test "$(git rev-parse refs/confidential-content/head)" = "${HEAD_SHA}"

      - name: Scan pull-request commits
        if: github.event_name == 'pull_request_target'
        id: scan-pr
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Work by an outside contributor (and its commits inside a Mergify
          # candidate) is advisory under the guard's provenance rules; everything
          # else is scanned normally.
          # Mergify authors the in-place merge commits used to update queued
          # branches and signs speculative candidates with a separate committer.
          # The booley-renovate GitHub App (#2559) authors dependency-update
          # commits. Trust these exact integration emails while scanning all
          # candidate content and every other commit identity normally.
          BOOLEY_LEAK_GUARD_ALLOWED_AUTHORS: |
            37929162+mergify[[]bot[]]@users.noreply.github.com
            commit-signer@mergify.com
            353471265+booley-renovate[[]bot[]]@users.noreply.github.com
          BOOLEY_LEAK_GUARD_KEY_B64: ${{ secrets.BOOLEY_LEAK_GUARD_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Content identical (same path and blob) to an entry of the base tip is
          # already accepted on main, so a merge of main into the branch does not
          # re-attribute it to the PR. Only PRs to main have such a trusted tip.
          trusted_base=()
          if [ "${BASE_REF}" = main ]; then
            trusted_base=(--trusted-base "${BASE_SHA}")
          fi
          # Advisory term findings of an outside PR collect here, then one
          # comment and label are posted. Every command runs in this step, so an
          # enforced finding, an incomplete scan, or a failed post fails the
          # required status.
          report="${RUNNER_TEMP}/confidential-advisory.jsonl"
          : > "${report}"
          printf '%s %s %s %s\n' \
            refs/confidential-content/head "${HEAD_SHA}" \
            refs/heads/main "${BASE_SHA}" \
            | python .github/scripts/confidential_content_guard.py --repo . pre-push \
              --pull-request-event "${GITHUB_EVENT_PATH}" \
              --advisory-report "${report}" \
              "${trusted_base[@]}"
          python .github/scripts/confidential_content_guard.py \
            --repo . verify-candidate --rev "${HEAD_SHA}" \
            --base "${BASE_SHA}" --event "${GITHUB_EVENT_PATH}" \
            --advisory-report "${report}" \
            "${trusted_base[@]}"
          python .github/scripts/confidential_content_guard.py \
            --repo . pull-request --event "${GITHUB_EVENT_PATH}" \
            --advisory-report "${report}"
          python .github/scripts/confidential_content_guard.py \
            --repo . post-advisory --event "${GITHUB_EVENT_PATH}" \
            --report "${report}"

      - name: Scan complete main history
        if: github.event_name != 'pull_request_target'
        id: scan-main
        continue-on-error: true
        env:
          # Mergify is the sole actor allowed to update main outside a human PR
          # merge. Trust its exact author and signer emails, and the
          # booley-renovate App author whose commits reach main through those
          # merges, while retaining content and identity checks for every
          # other commit in the immutable history.
          BOOLEY_LEAK_GUARD_ALLOWED_AUTHORS: |
            37929162+mergify[[]bot[]]@users.noreply.github.com
            commit-signer@mergify.com
            353471265+booley-renovate[[]bot[]]@users.noreply.github.com
          BOOLEY_LEAK_GUARD_KEY_B64: ${{ secrets.BOOLEY_LEAK_GUARD_KEY_B64 }}
          # Pull requests merged from another owner's branch (Mergify merge
          # method) are attributed to that owner and reported as advisory.
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >-
          python .github/scripts/confidential_content_guard.py
          --repo . audit --rev HEAD --repository-owner "${REPOSITORY_OWNER}"

      # pull_request_target runs from trusted main, so its native check run is
      # attached to main. Publish the required status on the exact PR head.
      - name: Publish scan status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_OUTCOME: ${{ steps.scan-pr.outcome }}
          PUSH_OUTCOME: ${{ steps.scan-main.outcome }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request_target ]; then
            target_sha="${PR_HEAD_SHA}"
            outcome="${PR_OUTCOME}"
          else
            target_sha="${GITHUB_SHA}"
            outcome="${PUSH_OUTCOME}"
          fi
          if [ "${outcome}" = success ]; then
            state=success
            description='Confidential-content scan passed'
          else
            state=failure
            description='Confidential-content scan failed'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
            -f state="${state}" \
            -f context=confidential-content \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Enforce scan result
        if: >-
          always() &&
          steps.scan-pr.outcome != 'success' &&
          steps.scan-main.outcome != 'success'
        run: exit 1
