name: Project site

# Builds website/ with MkDocs Material and publishes it to GitHub Pages at
# https://booley.dev/. Pull requests only build (strict), so broken links or
# config fail before merge; main pushes also deploy.
# One-time repo settings: Settings -> Pages -> Source = "GitHub Actions" and
# Custom domain = booley.dev (GitHub then redirects the old
# boldaxolotl.github.io/booley/ URLs here).

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/user/**"
      - "src/booley/runtime/docs_links.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/user/**"
      - "src/booley/runtime/docs_links.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment halfway; queue the next one behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install site toolchain
        run: python -m pip install -r website/requirements.txt

      - name: Build site
        working-directory: website
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/_build

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
