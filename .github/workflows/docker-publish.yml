name: Publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: boldaxolotl/booley-sandbox
  BASE_IMAGE_NAME: boldaxolotl/booley-sandbox-base
  RISCV_IMAGE_NAME: boldaxolotl/booley-sandbox-riscv

# A newer release cancels an older in-flight run before its promotion job can
# move `latest` backwards. Candidate tags remain available for diagnosis.
concurrency:
  group: docker-release-promotion
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Cold-cache build compiles the EDA stack from source (~57 min measured)
    # plus a multi-GB push to GHCR; 90 minutes was too tight.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: |
          {
            echo "version=$(cat VERSION)"
            echo "revision=$(git rev-parse --short HEAD)"
            echo "source_updated_at=$(git log -1 --format=%cI HEAD)"
            echo "image_built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "payload_fingerprint=$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.harness.build_stamp import resolve_payload_fingerprint; print(resolve_payload_fingerprint(Path.cwd()))')"
            echo "recipe_fingerprint=$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.runtime.image_provenance import resolve_recipe_fingerprint; print(resolve_recipe_fingerprint((Path("src/booley/data/docker/Dockerfile"),)))')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel
        run: |
          pip install build==1.6.0
          PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.harness.build_stamp import write_build_stamp; write_build_stamp(Path.cwd())'
          trap 'rm -f src/booley/_build_commit.py' EXIT
          python -m build --wheel --outdir dist/

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve compatible stable runtime base
        id: runtime-base
        shell: bash
        env:
          BASE_REF: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:main
        run: >-
          python .github/scripts/docker_base_contract.py --repo .
          --resolver remote --resolve-image "${BASE_REF}"
          --github-output "${GITHUB_OUTPUT}"

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/booley/data/docker/Dockerfile
          build-contexts: |
            booley-runtime-base=docker-image://${{ steps.runtime-base.outputs.image }}
          push: true
          sbom: true
          # Unique, non-advertised candidate tag. Public version/latest tags
          # are assigned only by the final digest-promotion job.
          tags: >-
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            BOOLEY_VERSION=${{ steps.version.outputs.version }}
            BOOLEY_SOURCE_REVISION=${{ steps.version.outputs.revision }}
            BOOLEY_SOURCE_UPDATED_AT=${{ steps.version.outputs.source_updated_at }}
            BOOLEY_IMAGE_BUILT_AT=${{ steps.version.outputs.image_built_at }}
            BOOLEY_PAYLOAD_FINGERPRINT=${{ steps.version.outputs.payload_fingerprint }}
            BOOLEY_RUNTIME_BASE_IMAGE=${{ steps.runtime-base.outputs.image }}
          labels: |
            io.booley.provenance.schema=2
            io.booley.payload.fingerprint=${{ steps.version.outputs.payload_fingerprint }}
            io.booley.build.recipe-fingerprint=${{ steps.version.outputs.recipe_fingerprint }}
            io.booley.build.parent-artifact-kind=registry-digest
            io.booley.build.parent-artifact=${{ steps.runtime-base.outputs.image }}
            io.booley.build.origin=registry
            booley.build-fingerprint=${{ steps.version.outputs.payload_fingerprint }}
          cache-from: type=gha,scope=sandbox
          # The shared scope has one writer: main pushes in test.yml. Release
          # builds reuse it without replacing it with tag- or dispatch-specific
          # state.

  # RISC-V variant: base sandbox + RISC-V toolchain/Spike/specs (Dockerfile.riscv).
  # It is `FROM booley-sandbox`; the build-context mapping below resolves that
  # bare name to the exact digest produced above, so a mutable tag cannot race
  # or redirect the derived-image build.
  build-and-push-riscv:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: |
          {
            echo "version=$(cat VERSION)"
            echo "payload_fingerprint=$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.harness.build_stamp import resolve_payload_fingerprint; print(resolve_payload_fingerprint(Path.cwd()))')"
            echo "recipe_fingerprint=$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.runtime.image_provenance import resolve_recipe_fingerprint; print(resolve_recipe_fingerprint((Path("src/booley/data/docker/Dockerfile.riscv"),)))')"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RISC-V image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/booley/data/docker/Dockerfile.riscv
          push: true
          sbom: true
          build-contexts: |
            booley-sandbox=docker-image://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          tags: >-
            ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            io.booley.provenance.schema=2
            io.booley.payload.fingerprint=${{ steps.version.outputs.payload_fingerprint }}
            io.booley.build.recipe-fingerprint=${{ steps.version.outputs.recipe_fingerprint }}
            io.booley.build.parent-artifact-kind=registry-digest
            io.booley.build.parent-artifact=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
            io.booley.build.origin=registry
            booley.build-fingerprint=${{ steps.version.outputs.payload_fingerprint }}
          # No GHA cache here: the riscv image is ~10 GB, larger than the
          # repo's entire 10 GB Actions cache budget — writing it would evict
          # the per-PR sandbox cache that bwave-smoke depends on, for a build
          # that only runs on release tags anyway.

  standard-image-contract:
    name: Standard image contract
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact standard candidate
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
        run: |
          docker pull "${IMAGE}"
          docker tag "${IMAGE}" booley-sandbox
      - name: Validate provenance, runtime, size, and resources
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/standard-image-evidence"
          expected="$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.harness.build_stamp import resolve_payload_fingerprint; print(resolve_payload_fingerprint(Path.cwd()))')"
          test "$(docker image inspect -f '{{ index .Config.Labels "io.booley.provenance.schema" }}' booley-sandbox)" = 2
          test "$(docker image inspect -f '{{ index .Config.Labels "io.booley.payload.fingerprint" }}' booley-sandbox)" = "${expected}"
          test -n "$(docker image inspect -f '{{ index .Config.Labels "io.booley.build.recipe-fingerprint" }}' booley-sandbox)"
          actual="$(docker run --rm --entrypoint python3 booley-sandbox -I -c 'from booley.runtime.build_metadata import current_build_metadata; print(current_build_metadata().payload_fingerprint)')"
          test "${actual}" = "${expected}"
          PYTHONPATH=src python .github/scripts/image_contract.py \
            --image "${IMAGE}" --flavor standard \
            --contract .github/contracts/session-runtime.toml \
            --evidence "${RUNNER_TEMP}/standard-image-evidence/runtime-contract.json"
          PYTHONPATH=src python .github/scripts/image_size_report.py \
            --registry-image "sandbox=${IMAGE}" \
            --limits .github/contracts/image-size-limits.toml --limit-image sandbox \
            --json "${RUNNER_TEMP}/standard-image-evidence/image-size.json" \
            --markdown "${RUNNER_TEMP}/standard-image-evidence/image-size.md"
          python .github/scripts/image_runtime_resources.py \
            --candidate-sha "${GITHUB_SHA}" --image "sandbox=${IMAGE}" \
            --json "${RUNNER_TEMP}/standard-image-evidence/runtime-resources.json" \
            --markdown "${RUNNER_TEMP}/standard-image-evidence/runtime-resources.md"
      - name: Retain standard image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-standard-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/standard-image-evidence/
          if-no-files-found: error

  openroad-runtime:
    name: OpenROAD runtime
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact standard candidate
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
        run: |
          docker pull "${IMAGE}"
          docker tag "${IMAGE}" booley-sandbox
      - name: Provision pinned Nangate45 PDK
        id: nangate
        run: |
          PDK_ROOT="$(PYTHONPATH=src python -c 'from booley.harness import nangate_pdk as p; root = p.cache_root(); p.fetch(root) if not p.is_ready(root) else None; assert p.is_ready(root); print(root)')"
          echo "root=${PDK_ROOT}" >> "${GITHUB_OUTPUT}"
      - name: Verify OpenROAD physical runtime
        env:
          VALIDATION_TMP: ${{ runner.temp }}/openroad-evidence
        run: |
          install -d -m 0777 "${VALIDATION_TMP}"
          .github/scripts/run_with_container_cleanup.sh \
            booley-release-${{ github.run_id }}-${{ github.run_attempt }}-openroad \
            docker run --rm --init --network none --user agent \
            --name booley-release-${{ github.run_id }}-${{ github.run_attempt }}-openroad \
            --mount type=bind,src="${{ github.workspace }}",dst=/booley-source,readonly \
            --mount type=bind,src="${{ steps.nangate.outputs.root }}",dst=/opt/pdk,readonly \
            --mount type=bind,src="${VALIDATION_TMP}",dst=/evidence \
            booley-sandbox bash /booley-source/.github/scripts/verify_openroad_runtime.sh \
            /opt/pdk /evidence
      - name: Retain OpenROAD evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-openroad-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openroad-evidence/
          if-no-files-found: error

  host-doctor-runtime:
    name: Host bootstrap, initialization, and Doctor
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Prepare exact reviewed demo contract
        uses: ./.github/actions/prepare-picorv32-demo
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare isolated uid-1000 host
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
        run: |
          root="${RUNNER_TEMP}/release-host-doctor"
          mkdir -p "${root}/home" "${root}/evidence"
          cp -a demo "${root}/project"
          python -m venv "${root}/venv"
          "${root}/venv/bin/pip" install .
          docker pull "${IMAGE}"
          docker tag "${IMAGE}" booley-sandbox
          doctor_gid="$(getent passwd 1000 | cut -d: -f4)"
          test -n "${doctor_gid}"
          echo "DOCTOR_GID=${doctor_gid}" >> "${GITHUB_ENV}"
          sudo chown -R "1000:${doctor_gid}" "${root}"
      - name: Run isolated host validation
        run: |
          runner_groups="$(id -G | tr ' ' ',')"
          sudo /usr/bin/setpriv \
            --reuid=1000 --regid="${DOCTOR_GID}" \
            --groups="${DOCTOR_GID},${runner_groups}" \
            -- "${RUNNER_TEMP}/release-host-doctor/venv/bin/python" \
            "${GITHUB_WORKSPACE}/.github/scripts/release_validation/host_doctor.py" \
            --allowed-root "${RUNNER_TEMP}/release-host-doctor" \
            --project "${RUNNER_TEMP}/release-host-doctor/project" \
            --home "${RUNNER_TEMP}/release-host-doctor/home" \
            --booley "${RUNNER_TEMP}/release-host-doctor/venv/bin/booley" \
            --expected-gid "${DOCTOR_GID}" \
            --candidate-sha "${GITHUB_SHA}" \
            --image-digest "${{ needs.build-and-push.outputs.image-digest }}" \
            --evidence "${RUNNER_TEMP}/release-host-doctor/evidence/host-doctor.json"
      - name: Restore isolated host ownership
        if: always()
        run: |
          if test -d "${RUNNER_TEMP}/release-host-doctor"; then
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/release-host-doctor"
          fi
      - name: Retain host Doctor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-host-doctor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-host-doctor/evidence/
          if-no-files-found: error

  simulation-selftest-overlay:
    name: Simulation self-test overlay isolation
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Prepare exact reviewed demo contract
        uses: ./.github/actions/prepare-picorv32-demo
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Simulation Doctor self-tests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/simulation-evidence"
          sudo chown -R 1000:1000 demo "${RUNNER_TEMP}/simulation-evidence"
          .github/scripts/run_with_container_cleanup.sh \
            booley-release-${{ github.run_id }}-${{ github.run_attempt }}-simulation \
            docker run --rm --init --network none \
            --name booley-release-${{ github.run_id }}-${{ github.run_attempt }}-simulation \
            --mount type=bind,src="${{ github.workspace }}",dst=/booley-source,readonly \
            --mount type=bind,src="${{ github.workspace }}/demo",dst=/work \
            --mount type=bind,src="${{ github.workspace }}/demo/.booley_project",dst=/booley-project \
            --mount type=bind,src="${RUNNER_TEMP}/simulation-evidence",dst=/evidence \
            -w /work -e BOOLEY_PROJECT_DIR=/booley-project -e BOOLEY_IN_SANDBOX=1 \
            -e PYTHONPATH=/booley-source/.github/scripts \
            "${IMAGE}" python3 -m release_validation.simulation_selftest \
            --project /work --booley /usr/local/bin/booley \
            --candidate-sha "${GITHUB_SHA}" \
            --image-digest "${{ needs.build-and-push.outputs.image-digest }}" \
            --evidence /evidence/simulation-selftest.json
      - name: Restore demo ownership
        if: always()
        run: |
          for path in demo "${RUNNER_TEMP}/simulation-evidence"; do
            if test -e "${path}"; then sudo chown -R "$(id -u):$(id -g)" "${path}"; fi
          done
      - name: Retain Simulation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simulation-evidence/
          if-no-files-found: error

  helper-image-metadata:
    name: Helper image metadata
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and inspect helper images
        run: bash .github/scripts/sidecar-build-evidence.sh
      - name: Retain helper image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-helper-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-build-evidence/
          if-no-files-found: error

  riscv-image-contract:
    name: RISC-V image contract
    needs: [build-and-push, build-and-push-riscv]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate exact RISC-V candidate
        env:
          BASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          RISCV_IMAGE: ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}@${{ needs.build-and-push-riscv.outputs.image-digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/riscv-image-evidence"
          docker pull "${BASE_IMAGE}"
          docker pull "${RISCV_IMAGE}"
          PYTHONPATH=src python .github/scripts/image_contract.py \
            --image "${RISCV_IMAGE}" --base-image "${BASE_IMAGE}" --flavor riscv \
            --contract .github/contracts/session-runtime.toml \
            --evidence "${RUNNER_TEMP}/riscv-image-evidence/runtime-contract.json"
          PYTHONPATH=src python .github/scripts/image_size_report.py \
            --registry-image "riscv=${RISCV_IMAGE}" \
            --limits .github/contracts/image-size-limits.toml --limit-image riscv \
            --json "${RUNNER_TEMP}/riscv-image-evidence/image-size.json" \
            --markdown "${RUNNER_TEMP}/riscv-image-evidence/image-size.md"
          python .github/scripts/image_runtime_resources.py \
            --candidate-sha "${GITHUB_SHA}" --image "riscv=${RISCV_IMAGE}" \
            --json "${RUNNER_TEMP}/riscv-image-evidence/runtime-resources.json" \
            --markdown "${RUNNER_TEMP}/riscv-image-evidence/runtime-resources.md"
          expected_parent="${BASE_IMAGE}"
          test "$(docker image inspect -f '{{ index .Config.Labels "io.booley.build.parent-artifact" }}' "${RISCV_IMAGE}")" = "${expected_parent}"
      - name: Retain RISC-V image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-riscv-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/riscv-image-evidence/
          if-no-files-found: error

  demo-ticket-surface:
    name: Demo ticket surface
    needs: [build-and-push, build-and-push-riscv]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "${GITHUB_OUTPUT}"
      - name: Prepare exact reviewed demo contract
        id: demo
        uses: ./.github/actions/prepare-picorv32-demo
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate immutable ticket surface
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}@${{ needs.build-and-push-riscv.outputs.image-digest }}
          TICKET_SLUG: ${{ steps.demo.outputs.ticket_slug }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/demo-surface-evidence"
          sudo chown -R 1000:1000 demo "${RUNNER_TEMP}/demo-surface-evidence"
          .github/scripts/run_with_container_cleanup.sh \
            booley-release-${{ github.run_id }}-${{ github.run_attempt }}-demo-surface \
            docker run --rm --init --network none \
            --name booley-release-${{ github.run_id }}-${{ github.run_attempt }}-demo-surface \
            --mount type=bind,src="${{ github.workspace }}",dst=/booley-source,readonly \
            --mount type=bind,src="${{ github.workspace }}/demo",dst=/work \
            --mount type=bind,src="${{ github.workspace }}/demo/.booley_project",dst=/booley-project \
            --mount type=bind,src="${RUNNER_TEMP}/demo-surface-evidence",dst=/evidence \
            -w /work -e BOOLEY_PROJECT_DIR=/booley-project -e BOOLEY_IN_SANDBOX=1 \
            -e PYTHONPATH=/booley-source/.github/scripts \
            "${IMAGE}" python3 -m release_validation.demo_surface \
            --project /work --project-state /booley-project --ticket-slug "${TICKET_SLUG}" \
            --expected-version "${EXPECTED_VERSION}" \
            --candidate-sha "${GITHUB_SHA}" \
            --image-digest "${{ needs.build-and-push-riscv.outputs.image-digest }}" \
            --evidence /evidence/demo-surface.json
      - name: Restore demo ownership
        if: always()
        run: |
          for path in demo "${RUNNER_TEMP}/demo-surface-evidence"; do
            if test -e "${path}"; then sudo chown -R "$(id -u):$(id -g)" "${path}"; fi
          done
      - name: Retain demo ticket evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-demo-ticket-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-surface-evidence/
          if-no-files-found: error

  picorv32-demo-flows:
    name: PicoRV32 demo flows
    needs: [build-and-push, build-and-push-riscv]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Prepare exact reviewed demo contract
        id: demo
        uses: ./.github/actions/prepare-picorv32-demo
      - name: Provision pinned Nangate45 PDK
        id: nangate
        run: |
          PDK_ROOT="$(PYTHONPATH=src python -c 'from booley.harness import nangate_pdk as p; root = p.cache_root(); p.fetch(root) if not p.is_ready(root) else None; assert p.is_ready(root); print(root)')"
          echo "root=${PDK_ROOT}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run exact reviewed demo flows
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}@${{ needs.build-and-push-riscv.outputs.image-digest }}
          TICKET_SLUG: ${{ steps.demo.outputs.ticket_slug }}
        run: |
          mkdir -p "${RUNNER_TEMP}/picorv32-evidence"
          sudo chown -R 1000:1000 demo "${RUNNER_TEMP}/picorv32-evidence"
          .github/scripts/run_with_container_cleanup.sh \
            booley-release-${{ github.run_id }}-${{ github.run_attempt }}-picorv32 \
            docker run --rm --init --network none \
            --name booley-release-${{ github.run_id }}-${{ github.run_attempt }}-picorv32 \
            --mount type=bind,src="${{ github.workspace }}",dst=/booley-source,readonly \
            --mount type=bind,src="${{ github.workspace }}/demo",dst=/work \
            --mount type=bind,src="${{ github.workspace }}/demo/.booley_project",dst=/booley-project \
            --mount type=bind,src="${{ steps.nangate.outputs.root }}",dst=/opt/pdk,readonly \
            --mount type=bind,src="${RUNNER_TEMP}/picorv32-evidence",dst=/evidence \
            -w /work -e BOOLEY_PROJECT_DIR=/booley-project -e BOOLEY_IN_SANDBOX=1 \
            -e TICKET_SLUG "${IMAGE}" bash -euo pipefail -c \
            'bash /booley-source/.github/scripts/verify_picorv32_demo.sh'
      - name: Restore demo ownership
        if: always()
        run: |
          for path in demo "${RUNNER_TEMP}/picorv32-evidence"; do
            if test -e "${path}"; then sudo chown -R "$(id -u):$(id -g)" "${path}"; fi
          done
      - name: Retain PicoRV32 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-picorv32-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/picorv32-evidence/
          if-no-files-found: warn

  ibex-lint-demo:
    name: Ibex lint demo
    needs: [build-and-push, build-and-push-riscv]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare exact reviewed Ibex candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lowRISC/ibex
          ref: 34b0705760ef3dfa00e99637432473d2be8f22f3
          path: ibex-demo
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run pinned Ibex lint demo
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}@${{ needs.build-and-push-riscv.outputs.image-digest }}
        run: |
          test "$(git -C ibex-demo rev-parse HEAD)" = 34b0705760ef3dfa00e99637432473d2be8f22f3
          sudo chown -R 1000:1000 ibex-demo
          .github/scripts/run_with_container_cleanup.sh \
            booley-release-${{ github.run_id }}-${{ github.run_attempt }}-ibex \
            docker run --rm --init --network none --user agent \
            --name booley-release-${{ github.run_id }}-${{ github.run_attempt }}-ibex \
            --mount type=bind,src="${{ github.workspace }}/ibex-demo",dst=/work -w /work \
            "${IMAGE}" bash -euo pipefail -c \
            'test -f /work/rtl/ibex_core.sv && fusesoc --cores-root=/work run \
            --target=lint lowrisc:ibex:ibex_core --verilator_options="--Wno-fatal"'
      - name: Restore Ibex ownership
        if: always()
        run: |
          if test -e ibex-demo; then
            sudo chown -R "$(id -u):$(id -g)" ibex-demo
          fi

  # Retag the already-tested manifests by digest. No Dockerfile or source
  # context is available to this job, so promotion cannot rebuild candidates.
  promote:
    name: Promote tested image digests
    needs:
      - build-and-push
      - build-and-push-riscv
      - standard-image-contract
      - openroad-runtime
      - host-doctor-runtime
      - simulation-selftest-overlay
      - helper-image-metadata
      - riscv-image-contract
      - demo-ticket-surface
      - picorv32-demo-flows
      - ibex-lint-demo
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact tested digests without rebuilding
        shell: bash
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          SANDBOX_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          RISCV_DIGEST: ${{ needs.build-and-push-riscv.outputs.image-digest }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}@${SANDBOX_DIGEST}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${RISCV_IMAGE_NAME}:${VERSION}" \
            --tag "${REGISTRY}/${RISCV_IMAGE_NAME}:latest" \
            "${REGISTRY}/${RISCV_IMAGE_NAME}@${RISCV_DIGEST}"
