name: Publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: boldaxolotl/booley-sandbox
  BASE_IMAGE_NAME: boldaxolotl/booley-sandbox-base
  RISCV_IMAGE_NAME: boldaxolotl/booley-sandbox-riscv

# A newer release cancels an older in-flight run before its promotion job can
# move `latest` backwards. Candidate tags remain available for diagnosis.
concurrency:
  group: docker-release-promotion
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Cold-cache build compiles the EDA stack from source (~57 min measured)
    # plus a multi-GB push to GHCR; 90 minutes was too tight.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: |
          {
            echo "version=$(cat VERSION)"
            echo "revision=$(git rev-parse --short HEAD)"
            echo "source_updated_at=$(git log -1 --format=%cI HEAD)"
            echo "image_built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "payload_fingerprint=$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.harness.build_stamp import resolve_payload_fingerprint; print(resolve_payload_fingerprint(Path.cwd()))')"
            echo "recipe_fingerprint=$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.runtime.image_provenance import resolve_recipe_fingerprint; print(resolve_recipe_fingerprint((Path("src/booley/data/docker/Dockerfile"),)))')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel
        run: |
          pip install build==1.6.0
          PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.harness.build_stamp import write_build_stamp; write_build_stamp(Path.cwd())'
          trap 'rm -f src/booley/_build_commit.py' EXIT
          python -m build --wheel --outdir dist/

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve compatible stable runtime base
        id: runtime-base
        shell: bash
        env:
          BASE_REF: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:main
        run: >-
          python .github/scripts/docker_base_contract.py --repo .
          --resolver shadow --resolve-image "${BASE_REF}"
          --github-output "${GITHUB_OUTPUT}"

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/booley/data/docker/Dockerfile
          build-contexts: |
            booley-runtime-base=docker-image://${{ steps.runtime-base.outputs.image }}
          push: true
          # Unique, non-advertised candidate tag. Public version/latest tags
          # are assigned only by the final digest-promotion job.
          tags: >-
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            BOOLEY_VERSION=${{ steps.version.outputs.version }}
            BOOLEY_SOURCE_REVISION=${{ steps.version.outputs.revision }}
            BOOLEY_SOURCE_UPDATED_AT=${{ steps.version.outputs.source_updated_at }}
            BOOLEY_IMAGE_BUILT_AT=${{ steps.version.outputs.image_built_at }}
            BOOLEY_PAYLOAD_FINGERPRINT=${{ steps.version.outputs.payload_fingerprint }}
            BOOLEY_RUNTIME_BASE_IMAGE=${{ steps.runtime-base.outputs.image }}
          labels: |
            io.booley.provenance.schema=2
            io.booley.payload.fingerprint=${{ steps.version.outputs.payload_fingerprint }}
            io.booley.build.recipe-fingerprint=${{ steps.version.outputs.recipe_fingerprint }}
            io.booley.build.parent-artifact-kind=registry-digest
            io.booley.build.parent-artifact=${{ steps.runtime-base.outputs.image }}
            io.booley.build.origin=registry
            booley.build-fingerprint=${{ steps.version.outputs.payload_fingerprint }}
          cache-from: type=gha,scope=sandbox
          # Same scope as bwave-smoke in test.yml, so tag builds reuse the
          # per-PR cache. ignore-error: a failed cache upload must not fail
          # a release build.
          cache-to: type=gha,scope=sandbox,mode=max,ignore-error=true

  # RISC-V variant: base sandbox + RISC-V toolchain/Spike/specs (Dockerfile.riscv).
  # It is `FROM booley-sandbox`; the build-context mapping below resolves that
  # bare name to the exact digest produced above, so a mutable tag cannot race
  # or redirect the derived-image build.
  build-and-push-riscv:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: |
          {
            echo "version=$(cat VERSION)"
            echo "payload_fingerprint=$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.harness.build_stamp import resolve_payload_fingerprint; print(resolve_payload_fingerprint(Path.cwd()))')"
            echo "recipe_fingerprint=$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.runtime.image_provenance import resolve_recipe_fingerprint; print(resolve_recipe_fingerprint((Path("src/booley/data/docker/Dockerfile.riscv"),)))')"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RISC-V image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/booley/data/docker/Dockerfile.riscv
          push: true
          build-contexts: |
            booley-sandbox=docker-image://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          tags: >-
            ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            io.booley.provenance.schema=2
            io.booley.payload.fingerprint=${{ steps.version.outputs.payload_fingerprint }}
            io.booley.build.recipe-fingerprint=${{ steps.version.outputs.recipe_fingerprint }}
            io.booley.build.parent-artifact-kind=registry-digest
            io.booley.build.parent-artifact=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
            io.booley.build.origin=registry
            booley.build-fingerprint=${{ steps.version.outputs.payload_fingerprint }}
          # No GHA cache here: the riscv image is ~10 GB, larger than the
          # repo's entire 10 GB Actions cache budget — writing it would evict
          # the per-PR sandbox cache that bwave-smoke depends on, for a build
          # that only runs on release tags anyway.

  # Release-only integration check for the public PicoRV32 demo linked from
  # Booley's README. Pull the exact digest built above rather than `latest`, so
  # a concurrent release cannot redirect the smoke test to another image.
  demo-smoke:
    name: Smoke-test PicoRV32 demo
    needs: [build-and-push, build-and-push-riscv]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read

    steps:
      # Keep this checkout at the release ref. It supplies the checksum-pinned
      # Nangate fetcher and the expected package version for the image check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Prepare exact reviewed demo contract
        id: demo
        uses: ./.github/actions/prepare-picorv32-demo

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install release CLI
        run: |
          python -m pip install --user .
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Provision pinned Nangate45 PDK
        id: nangate
        shell: bash
        run: |
          PDK_ROOT="$(PYTHONPATH=src python -c 'from booley.harness import nangate_pdk as p; root = p.cache_root(); p.fetch(root) if not p.is_ready(root) else None; assert p.is_ready(root); print(root)')"
          echo "root=${PDK_ROOT}" >> "${GITHUB_OUTPUT}"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact release images
        env:
          BASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          RISCV_IMAGE: ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}@${{ needs.build-and-push-riscv.outputs.image-digest }}
        run: |
          docker pull "${BASE_IMAGE}"
          docker tag "${BASE_IMAGE}" booley-sandbox
          docker pull "${RISCV_IMAGE}"
          docker tag "${RISCV_IMAGE}" booley-sandbox-riscv

      - name: Verify release image provenance
        run: |
          expected="$(PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.harness.build_stamp import resolve_payload_fingerprint; print(resolve_payload_fingerprint(Path.cwd()))')"
          for image in booley-sandbox booley-sandbox-riscv; do
            test "$(docker image inspect -f '{{ index .Config.Labels "io.booley.provenance.schema" }}' "$image")" = "2"
            test "$(docker image inspect -f '{{ index .Config.Labels "io.booley.payload.fingerprint" }}' "$image")" = "$expected"
            test -n "$(docker image inspect -f '{{ index .Config.Labels "io.booley.build.recipe-fingerprint" }}' "$image")"
            test -n "$(docker image inspect -f '{{ index .Config.Labels "io.booley.build.parent-artifact" }}' "$image")"
            test -n "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            actual="$(docker run --rm --entrypoint python3 "$image" -I -c 'from booley.runtime.build_metadata import current_build_metadata; print(current_build_metadata().payload_fingerprint)')"
            test "$actual" = "$expected"
          done
          base_digest="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}"
          test "$(docker image inspect -f '{{ index .Config.Labels "io.booley.build.parent-artifact-kind" }}' booley-sandbox-riscv)" = "registry-digest"
          test "$(docker image inspect -f '{{ index .Config.Labels "io.booley.build.parent-artifact" }}' booley-sandbox-riscv)" = "$base_digest"
          docker image inspect --format '{{json .RepoDigests}}' booley-sandbox | grep -Fq "${base_digest}"

      # Hosted runners have no desktop editor. Supply only the `code --version`
      # probe that init requires; the smoke never attempts to launch an editor.
      - name: Provide headless editor probe
        run: |
          mkdir -p "${RUNNER_TEMP}/booley-ci-bin"
          ln -s "$(command -v git)" "${RUNNER_TEMP}/booley-ci-bin/code"
          echo "${RUNNER_TEMP}/booley-ci-bin" >> "${GITHUB_PATH}"

      # The contract requires both reviewed checkouts to stay pristine. Run it
      # before `booley init`, which deliberately creates local setup files.
      - name: Prepare reviewed demo checkout ownership
        run: sudo chown -R 1000:1000 demo

      - name: Verify exact reviewed demo contract
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}@${{ needs.build-and-push-riscv.outputs.image-digest }}
          TICKET_SLUG: ${{ steps.demo.outputs.ticket_slug }}
        run: |
          docker run --init --rm --network none \
            --mount type=bind,src="${{ github.workspace }}",dst=/booley-source,readonly \
            --mount type=bind,src="${{ github.workspace }}/demo",dst=/work \
            --mount type=bind,src="${{ github.workspace }}/demo/.booley_project",dst=/booley-project \
            --mount type=bind,src="${{ steps.nangate.outputs.root }}",dst=/opt/pdk,readonly \
            -w /work \
            -e BOOLEY_PROJECT_DIR=/booley-project \
            -e BOOLEY_IN_SANDBOX=1 \
            -e TICKET_SLUG \
            "${IMAGE}" bash -euo pipefail -c '
              bash /booley-source/.github/scripts/verify_picorv32_demo.sh
            '

      - name: Restore demo checkout ownership for initialization
        run: sudo chown -R "$(id -u):$(id -g)" demo

      - name: Bootstrap reusable host resources as documented
        run: booley bootstrap

      # Exercise the public quick start and reject warnings as well as errors.
      # Credentials are deliberately absent: this validation never contacts an
      # agent provider, but still records the demo's configured agent policy.
      - name: Initialize demo cleanly as documented
        working-directory: demo
        run: |
          init_log="$(mktemp)"
          booley init --skip-credentials | tee "${init_log}"
          if grep -Fq "[!!]" "${init_log}" || grep -Fq "[XX]" "${init_log}"; then
            echo "booley init did not finish cleanly" >&2
            exit 1
          fi

      - name: Measure release image storage contract
        env:
          BASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
          RISCV_IMAGE: ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}@${{ needs.build-and-push-riscv.outputs.image-digest }}
        run: |
          python .github/scripts/image_size_report.py \
            --registry-image "sandbox=${BASE_IMAGE}" \
            --registry-image "riscv=${RISCV_IMAGE}" \
            --local-image "proxy=booley-egress-proxy" \
            --local-image "reaper=booley-reaper" \
            --json "${RUNNER_TEMP}/booley-image-sizes.json" \
            --markdown "${RUNNER_TEMP}/booley-image-sizes.md"
          cat "${RUNNER_TEMP}/booley-image-sizes.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain release image storage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: booley-image-sizes-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/booley-image-sizes.json
          if-no-files-found: error

      # actions/checkout files belong to the runner user (uid 1001), while the
      # production image deliberately runs as `agent` (uid 1000). The demo
      # writes generated firmware and Flow reports, so make its checkout match
      # the same ownership a normal Linux user's bind mount has.
      - name: Prepare demo checkout ownership
        run: sudo chown -R 1000:1000 demo

      - name: Run demo Doctor and ticket-authoring surface smoke
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.RISCV_IMAGE_NAME }}@${{ needs.build-and-push-riscv.outputs.image-digest }}
          EXPECTED_BOOLEY_VERSION: ${{ steps.version.outputs.version }}
          TICKET_SLUG: ${{ steps.demo.outputs.ticket_slug }}
        run: |
          docker run --init --rm --network none \
            --mount type=bind,src="${{ github.workspace }}",dst=/booley-source,readonly \
            --mount type=bind,src="${{ github.workspace }}/demo",dst=/work \
            --mount type=bind,src="${{ github.workspace }}/demo/.booley_project",dst=/booley-project \
            --mount type=bind,src="${{ steps.nangate.outputs.root }}",dst=/opt/pdk,readonly \
            -w /work \
            -e BOOLEY_PROJECT_DIR=/booley-project \
            -e BOOLEY_IN_SANDBOX=1 \
            -e EXPECTED_BOOLEY_VERSION \
            -e TICKET_SLUG \
            "${IMAGE}" bash -euo pipefail -c '
              python -c "import booley, os; assert booley.__version__ == os.environ[\"EXPECTED_BOOLEY_VERSION\"]"
              project_dir="$(python -c "from booley.runtime.project_dir import resolve_project_dir; print(resolve_project_dir())")"
              ticket_slug="${TICKET_SLUG}"
              BOOLEY_AGENT_APP=codex python -m booley.runtime.incontainer_register
              ticket="${project_dir}/tickets/board/queue/${ticket_slug}.md"
              before="$(sha256sum "${ticket}")"

              doctor_log="$(mktemp)"
              booley doctor --deep --skip-agent-checks | tee "${doctor_log}"
              grep -Fq "0 warning(s)" "${doctor_log}"
              grep -Fq "0 failed." "${doctor_log}"

              python -c "from booley.runtime.paths import skills_dir; assert (skills_dir() / \"booley-ticket-create\" / \"SKILL.md\").is_file()"
              python -m booley.ticket_board validate-ticket "${ticket}"
              python -m booley.ticket_board show "${ticket_slug}" >/dev/null
              python -c "from pathlib import Path; from booley.harness.preflight import run_preflight; run_preflight(Path.cwd())"
              booley board show

              test -f "${ticket}"
              test ! -e "${project_dir}/tickets/board/active/${ticket_slug}.md"
              test "${before}" = "$(sha256sum "${ticket}")"
            '

      # The production image runs as uid 1000, while checkout cleanup runs as
      # the hosted-runner user. Restore the nested repositories even when the
      # smoke fails so checkout's post-job hooks can read their git metadata.
      - name: Restore demo checkout ownership
        if: always()
        run: |
          if test -e demo; then
            sudo chown -R "$(id -u):$(id -g)" demo
          fi

  # Retag the already-tested manifests by digest. No Dockerfile or source
  # context is available to this job, so promotion cannot rebuild candidates.
  promote:
    name: Promote tested image digests
    needs: [build-and-push, build-and-push-riscv, demo-smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact tested digests without rebuilding
        shell: bash
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
          SANDBOX_DIGEST: ${{ needs.build-and-push.outputs.image-digest }}
          RISCV_DIGEST: ${{ needs.build-and-push-riscv.outputs.image-digest }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}@${SANDBOX_DIGEST}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${RISCV_IMAGE_NAME}:${VERSION}" \
            --tag "${REGISTRY}/${RISCV_IMAGE_NAME}:latest" \
            "${REGISTRY}/${RISCV_IMAGE_NAME}@${RISCV_DIGEST}"
