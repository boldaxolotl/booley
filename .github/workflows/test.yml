name: Tests

on:
  push:
    branches: [main]
  # Run on stacked PRs as well as PRs targeting main. Each optimization phase
  # has its own reviewable base branch and must retain the same CI coverage.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One run per branch/PR: a new push cancels the still-running stale build.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      python_source: ${{ steps.classify.outputs.python_source }}
      python_tests: ${{ steps.classify.outputs.python_tests }}
      image_tests: ${{ steps.classify.outputs.image_tests }}
      native_bwave: ${{ steps.classify.outputs.native_bwave }}
      rust: ${{ steps.classify.outputs.rust }}
      docker_toolchain: ${{ steps.classify.outputs.docker_toolchain }}
      stable_base: ${{ steps.classify.outputs.stable_base }}
      packaging: ${{ steps.classify.outputs.packaging }}
      workflow: ${{ steps.classify.outputs.workflow }}
      release: ${{ steps.classify.outputs.release }}
      full: ${{ steps.classify.outputs.full }}
      jobs: ${{ steps.classify.outputs.jobs }}
      build_stable_base: ${{ steps.classify.outputs.build_stable_base }}
      required_jobs: ${{ steps.classify.outputs.required_jobs }}
      diff_base: ${{ steps.classify.outputs.diff_base }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ github.event_name != 'pull_request' }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python .github/scripts/ci_changes.py
          --repo . --base "${BASE_SHA}" --head "${HEAD_SHA}"
          --github-output "${GITHUB_OUTPUT}" --force-all "${FORCE_ALL}"

  docs-check:
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['docs-check']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check documentation diff
        env:
          BASE_SHA: ${{ needs.changes.outputs.diff_base }}
        run: git diff --check "${BASE_SHA}" "${GITHUB_SHA}" --

  lint:
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['lint']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Pinned so a new ruff release with new rules can't break CI out of the
      # blue; bump deliberately (and re-run `ruff check .` locally first).
      # Must stay in lockstep with the `ruff==` pin in pyproject.toml's dev extra.
      - name: Install ruff
        run: pip install ruff==0.15.18

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['test']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      COVERAGE_LEG: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      # Every compatibility leg runs across four workers with module/class
      # affinity. pytest-cov combines worker and configured subprocess data.
      - name: Run tests (parallel)
        if: env.COVERAGE_LEG != 'true'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: >-
          pytest tests/ -q --tb=short -n 4 --dist=loadscope
          --basetemp "${{ runner.temp }}/pytest" -m "not native_bwave"
          --durations=30 --junitxml="${{ runner.temp }}/junit.xml"

      # Fold the former standalone coverage job into the existing Linux/3.13
      # compatibility leg. This preserves its full suite and fail-under gate
      # without serializing a seventh full-suite run after the matrix.
      - name: Run tests with coverage
        if: env.COVERAGE_LEG == 'true'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          pytest tests/ -q --tb=short -n 4 --dist=loadscope \
            --basetemp "${{ runner.temp }}/pytest" -m "not native_bwave" \
            --cov=booley --cov-report= --cov-fail-under=60 \
            --durations=30 --junitxml="${{ runner.temp }}/junit.xml"
          # pytest-cov gates its worker aggregate as pytest exits. coverage.py
          # then combines configured subprocess shards and re-gates the exact
          # finalized database used to produce the XML artifact.
          coverage report --fail-under=60
          coverage xml -o coverage.xml

      - name: Upload test timing data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/junit.xml
          if-no-files-found: warn

      - name: Upload coverage artifact
        if: env.COVERAGE_LEG == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  rust-test:
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['rust-test']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/bwave

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path crates/bwave/Cargo.toml

      - name: Run all Rust tests and benchmark targets
        run: cargo test --all-targets --locked --manifest-path crates/bwave/Cargo.toml

      - name: Run Clippy
        # Existing findings are baselined by category after `-D warnings` so
        # every other Rust/Clippy warning is fatal. Remove these narrow allows
        # as the corresponding first-party lint debt is cleaned up.
        run: >
          cargo clippy --all-targets --all-features --locked
          --manifest-path crates/bwave/Cargo.toml -- -D warnings
          -A clippy::cloned-ref-to-slice-refs
          -A clippy::collapsible-if
          -A clippy::comparison-to-empty
          -A clippy::double-ended-iterator-last
          -A clippy::large-enum-variant
          -A clippy::map-identity
          -A clippy::manual-checked-ops
          -A clippy::manual-contains
          -A clippy::manual-div-ceil
          -A clippy::manual-is-multiple-of
          -A clippy::manual-pattern-char-comparison
          -A clippy::manual-range-contains
          -A clippy::needless-borrows-for-generic-args
          -A clippy::needless-range-loop
          -A clippy::same-item-push
          -A clippy::too-many-arguments
          -A clippy::type-complexity
          -A clippy::unnecessary-cast
          -A clippy::unnecessary-map-or
          -A clippy::unnecessary-unwrap
          -A clippy::unwrap-or-default
          -A clippy::useless-borrows-in-formatting
          -A clippy::while-let-loop
          -A clippy::write-with-newline
          -A clippy::writeln-empty-string
          -A clippy::wrong-self-convention

  bwave-integration:
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['bwave-integration']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/bwave

      # The Xcelium suite resolves this exact debug path at collection time;
      # building it up front makes a missing binary a failure, not a skip.
      - name: Build bwave (debug)
        run: cargo build --locked --manifest-path crates/bwave/Cargo.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run B-Wave crate Python tests
        shell: bash
        run: |
          test -x crates/bwave/target/debug/bwave
          pytest crates/bwave/tests/test_*.py -q --tb=short -rs \
            --durations=30 --junitxml="${RUNNER_TEMP}/bwave-crate.xml"

      - name: Run native B-Wave wrapper and contract tests
        shell: bash
        run: |
          test -x crates/bwave/target/debug/bwave
          pytest tests/ -m native_bwave -q --tb=short -rs \
            --durations=30 --junitxml="${RUNNER_TEMP}/bwave-native.xml"
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse(Path(os.environ["RUNNER_TEMP"]) / "bwave-native.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          executed = sum(int(suite.attrib["tests"]) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          assert executed == 11, f"expected 11 native B-Wave tests, executed {executed}"
          assert skipped == 0, f"native B-Wave tests skipped unexpectedly: {skipped}"
          PY

      - name: Upload B-Wave timing data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-bwave-integration
          path: ${{ runner.temp }}/bwave-*.xml
          if-no-files-found: warn

  package-artifacts:
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['package-artifacts']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          pip install build==1.3.0 twine==6.1.0
          python -m build
          twine check dist/*

      - name: Reject redistributed native and Nangate payloads
        run: bash .github/scripts/validate_distribution_payloads.sh dist

      - name: Validate direct wheel from a clean environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/direct-wheel-venv"
          "${RUNNER_TEMP}/direct-wheel-venv/bin/pip" install dist/*.whl
          cd "${RUNNER_TEMP}"
          BOOLEY_CONTAINER=1 "${RUNNER_TEMP}/direct-wheel-venv/bin/python" \
            "${GITHUB_WORKSPACE}/.github/scripts/validate_installed_artifact.py" \
            --inventory "${RUNNER_TEMP}/direct-wheel-files.txt" \
            --forbid-root "${GITHUB_WORKSPACE}"

      - name: Build and validate wheel from source distribution
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/sdist-wheel"
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/sdist-wheel" dist/*.tar.gz
          python -m venv "${RUNNER_TEMP}/sdist-wheel-venv"
          "${RUNNER_TEMP}/sdist-wheel-venv/bin/pip" install "${RUNNER_TEMP}"/sdist-wheel/*.whl
          cd "${RUNNER_TEMP}"
          BOOLEY_CONTAINER=1 "${RUNNER_TEMP}/sdist-wheel-venv/bin/python" \
            "${GITHUB_WORKSPACE}/.github/scripts/validate_installed_artifact.py" \
            --inventory "${RUNNER_TEMP}/sdist-wheel-files.txt" \
            --forbid-root "${GITHUB_WORKSPACE}"
          diff -u "${RUNNER_TEMP}/direct-wheel-files.txt" \
            "${RUNNER_TEMP}/sdist-wheel-files.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-dist
          path: dist/
          if-no-files-found: error


  bwave-smoke:
    runs-on: ubuntu-latest
    needs: [changes, package-artifacts]
    if: fromJSON(needs.changes.outputs.jobs)['bwave-smoke']
    # An uncached image build compiles the EDA stack from source (~57 min
    # measured), then loads a ~6 GB image and uploads the layer cache — a
    # 60-minute budget killed the first run mid-flight. Cached rebuilds
    # finish in minutes; the generous ceiling is for cold-cache runs only.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install host-side test dependency
        run: pip install pytest==8.4.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-dist
          path: dist/

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute stable-base compatibility contract
        id: base-contract
        shell: bash
        run: |
          python .github/scripts/docker_base_contract.py \
            --repo . --github-output "${GITHUB_OUTPUT}"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Select compatible stable runtime base
        id: runtime-base
        shell: bash
        env:
          BUILD_STABLE_BASE: ${{ needs.changes.outputs.build_stable_base }}
          PUBLISHED_BASE: ghcr.io/boldaxolotl/booley-sandbox-base:main
        run: |
          if [[ "${BUILD_STABLE_BASE}" == "true" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "image=booley-runtime-base:ci" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python .github/scripts/docker_base_contract.py --repo . \
            --resolve-image "${PUBLISHED_BASE}" --github-output "${GITHUB_OUTPUT}"
          echo "build=false" >> "${GITHUB_OUTPUT}"

      # A PR that changes a stable-base input must test that candidate without
      # publishing untrusted layers. Reuse the trusted main-branch cache, but do
      # not export the PR's result back into that shared scope.
      - name: Build changed stable runtime base locally
        if: steps.runtime-base.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/booley/data/docker/Dockerfile.base
          load: true
          tags: booley-runtime-base:ci
          build-args: |
            BOOLEY_BASE_SOURCE_REVISION=${{ github.sha }}
            BOOLEY_BASE_CONTRACT=${{ steps.base-contract.outputs.contract }}
            BOOLEY_BASE_BUILT_AT=${{ steps.base-contract.outputs.built_at }}
          cache-from: type=gha,scope=sandbox-runtime-base

      # The default daemon-backed builder can consume the locally loaded base
      # by named context (verified by the workflow contract).
      - name: Build candidate from changed stable base
        if: steps.runtime-base.outputs.build == 'true'
        shell: bash
        run: |
          set -o pipefail
          docker buildx build --builder default --load \
            --file src/booley/data/docker/Dockerfile \
            --tag booley-test \
            --build-arg "BOOLEY_RUNTIME_BASE_IMAGE=booley-runtime-base:ci" \
            --build-context booley-runtime-base=docker-image://booley-runtime-base:ci . \
            2>&1 | tee "${RUNNER_TEMP}/stable-base-build.log"

      - name: Upload failed stable-base build log
        if: failure() && steps.runtime-base.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-base-build-log
          path: ${{ runner.temp }}/stable-base-build.log
          if-no-files-found: warn

      # Load into the local docker store (not push) so `docker run` below works;
      # GHA layer cache keeps rebuilds fast when the Dockerfile didn't change.
      - name: Build candidate from published stable base
        if: steps.runtime-base.outputs.build != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/booley/data/docker/Dockerfile
          build-contexts: |
            booley-runtime-base=docker-image://${{ steps.runtime-base.outputs.image }}
          build-args: |
            BOOLEY_RUNTIME_BASE_IMAGE=${{ steps.runtime-base.outputs.image }}
          load: true
          tags: booley-test
          cache-from: type=gha,scope=sandbox
          # ignore-error: a failed cache upload must not fail the job — the
          # image is already built and the smoke test can still run.
          cache-to: type=gha,scope=sandbox,mode=max,ignore-error=true

      - name: Capture Docker cache and layer evidence
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-build-evidence"
          docker image inspect booley-test \
            > "${RUNNER_TEMP}/docker-build-evidence/image-inspect.json"
          docker history --no-trunc --format \
            '{{json .}}' booley-test \
            | tee "${RUNNER_TEMP}/docker-build-evidence/layers.jsonl"

      - name: Upload Docker build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-build-evidence
          path: ${{ runner.temp }}/docker-build-evidence/
          if-no-files-found: error

      - name: Prepare and verify sandbox image test prerequisites
        shell: bash
        run: |
          docker tag booley-test booley-sandbox
          docker image inspect booley-sandbox >/dev/null
          docker run --rm booley-sandbox sh -c 'command -v verible-verilog-lint'
          docker run --rm booley-sandbox python3 -c 'import edalize.tools.verible'

      # Use the same checksum-pinned fetcher as `booley init`. The payload is
      # deliberately not cached or baked into the image; it includes the
      # upstream notice and is mounted read-only only for this job.
      - name: Provision pinned Nangate45 PDK
        id: nangate
        shell: bash
        run: |
          PDK_ROOT="$(PYTHONPATH=src python -c 'from booley.harness import nangate_pdk as p; root = p.cache_root(); p.fetch(root) if not p.is_ready(root) else None; assert p.is_ready(root); print(root)')"
          echo "root=${PDK_ROOT}" >> "${GITHUB_OUTPUT}"

      - name: Prepare isolated validation temp directories
        shell: bash
        run: |
          for validation in verible isolation fifo native-fst simulator ticket-mode; do
            install -d -m 0777 "${RUNNER_TEMP}/bwave-smoke/${validation}"
          done

      # GitHub's native parallel group retains a separate log and exit status
      # for every validation while sharing the already-loaded candidate image.
      - parallel:
          - name: Run Verible production-image end-to-end test
            env:
              VALIDATION_TMP: ${{ runner.temp }}/bwave-smoke/verible
              TMPDIR: ${{ runner.temp }}/bwave-smoke/verible
              BOOLEY_DOCKER_NAME_PREFIX: booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-verible
            run: >-
              .github/scripts/run_with_container_cleanup.sh
              "${BOOLEY_DOCKER_NAME_PREFIX}"
              pytest tests/docker/test_sandbox_verible_e2e.py
              -q --tb=short -rs --basetemp "${VALIDATION_TMP}/pytest"

          - name: Run sandbox isolation suite
            env:
              VALIDATION_TMP: ${{ runner.temp }}/bwave-smoke/isolation
              TMPDIR: ${{ runner.temp }}/bwave-smoke/isolation
              BOOLEY_DOCKER_NAME_PREFIX: booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-isolation
            run: >-
              .github/scripts/run_with_container_cleanup.sh
              "${BOOLEY_DOCKER_NAME_PREFIX}"
              python -m tests.docker.isolation.run_isolation_tests

          - name: Run FIFO pipeline smoke test
            env:
              VALIDATION_TMP: ${{ runner.temp }}/bwave-smoke/fifo
            run: >-
              .github/scripts/run_with_container_cleanup.sh
              booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-fifo
              docker run --rm --init
              --name booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-fifo
              --mount type=bind,src="${{ github.workspace }}",dst=/work,readonly
              --mount type=bind,src="${VALIDATION_TMP}",dst=/validation-tmp
              -e TMPDIR=/validation-tmp
              booley-test bash -c "pip install --break-system-packages pytest &&
              python -m pytest /work/tests/sim/test_bwave_fifo_pipeline.py
              -v -k 'not slow' -o cache_dir=/validation-tmp/pytest-cache"

          - name: Run native FST/Verilator cross-validation
            env:
              VALIDATION_TMP: ${{ runner.temp }}/bwave-smoke/native-fst
            run: >-
              .github/scripts/run_with_container_cleanup.sh
              booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-native-fst
              docker run --rm --init
              --name booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-native-fst
              --mount type=bind,src="${{ github.workspace }}",dst=/work,readonly
              --mount type=bind,src="${VALIDATION_TMP}",dst=/validation-tmp
              -e TMPDIR=/validation-tmp
              booley-test python /work/crates/bwave/tests/native_fst_verilator_test.py

          - name: Run simulator ground-truth tests
            env:
              VALIDATION_TMP: ${{ runner.temp }}/bwave-smoke/simulator
            run: >-
              .github/scripts/run_with_container_cleanup.sh
              booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-simulator
              docker run --rm --init
              --name booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-simulator
              --mount type=bind,src="${{ github.workspace }}",dst=/work,readonly
              --mount type=bind,src="${VALIDATION_TMP}",dst=/validation-tmp
              -e TMPDIR=/validation-tmp
              booley-test bash -c "pip install --break-system-packages pytest &&
              python -m pytest /work/crates/bwave/tests/simulator_ground_truth_test.py
              -q --tb=short -o cache_dir=/validation-tmp/pytest-cache"

          - name: Run Ticket Mode production-image smoke
            env:
              VALIDATION_TMP: ${{ runner.temp }}/bwave-smoke/ticket-mode
            run: >-
              .github/scripts/run_with_container_cleanup.sh
              booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-ticket-mode
              docker run --rm --init
              --name booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-ticket-mode
              --mount type=bind,src="${{ github.workspace }}",dst=/work,readonly
              --mount type=bind,src="${{ steps.nangate.outputs.root }}",dst=/opt/pdk,readonly
              --mount type=bind,src="${VALIDATION_TMP}",dst=/validation-tmp
              -e TMPDIR=/validation-tmp -e BOOLEY_TICKET_MODE_SMOKE=1
              booley-test bash -c "pip install --break-system-packages pytest pytest-asyncio &&
              python -m pytest /work/tests/smoke/test_ticket_mode_image_smoke.py
              -v --tb=short -o cache_dir=/validation-tmp/pytest-cache"

      - name: Clean up image validation containers
        if: always()
        shell: bash
        run: |
          prefix="^/booley-ci-${{ github.run_id }}-${{ github.run_attempt }}-"
          mapfile -t containers < <(docker ps -aq --filter "name=${prefix}")
          if (( ${#containers[@]} )); then
            docker rm -f "${containers[@]}"
          fi

  ci-required:
    name: ci-required
    needs:
      - changes
      - docs-check
      - lint
      - test
      - rust-test
      - bwave-integration
      - package-artifacts
      - bwave-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve required CI status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: ${{ needs.changes.outputs.required_jobs }}
        run: >-
          python .github/scripts/ci_required.py
          --required "${REQUIRED_JOBS}" --needs-json "${NEEDS_JSON}"
