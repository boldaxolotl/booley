name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR: a new push cancels the still-running stale build.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      # Pinned so a new ruff release with new rules can't break CI out of the
      # blue; bump deliberately (and re-run `ruff check .` locally first).
      # Must stay in lockstep with the `ruff==` pin in pyproject.toml's dev extra.
      - name: Install ruff
        run: pip install ruff==0.15.18

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The bwave session tests cargo-build the native binary on demand when it
      # isn't bundled (fresh checkout). Cache that build so it's ~free after the
      # first run per platform.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/bwave

      # Pre-build here, where there is no per-test 120s pytest-timeout cap: a
      # cold cargo build inside the on-demand test path can exceed that cap on
      # a slow runner, failing the test instead of exercising it.
      - name: Build bwave (release)
        run: cargo build --release --manifest-path crates/bwave/Cargo.toml

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q --tb=short

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/bwave

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path crates/bwave/Cargo.toml

      - name: Run all Rust tests and benchmark targets
        run: cargo test --all-targets --locked --manifest-path crates/bwave/Cargo.toml

  bwave-smoke:
    runs-on: ubuntu-latest
    # An uncached image build compiles the EDA stack from source (~57 min
    # measured), then loads a ~6 GB image and uploads the layer cache — a
    # 60-minute budget killed the first run mid-flight. Cached rebuilds
    # finish in minutes; the generous ceiling is for cold-cache runs only.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Load into the local docker store (not push) so `docker run` below works;
      # GHA layer cache keeps rebuilds fast when the Dockerfile didn't change.
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/booley/data/docker/Dockerfile
          load: true
          tags: booley-test
          cache-from: type=gha,scope=sandbox
          # ignore-error: a failed cache upload must not fail the job — the
          # image is already built and the smoke test can still run.
          cache-to: type=gha,scope=sandbox,mode=max,ignore-error=true

      - name: Run FIFO pipeline smoke test
        run: >
          docker run --rm -v "${{ github.workspace }}:/work" booley-test
          bash -c "pip install --break-system-packages pytest &&
          python -m pytest /work/tests/sim/test_bwave_fifo_pipeline.py
          -v -k 'not slow'"

      - name: Cross-validate B-Wave against simulator traces
        run: >
          docker run --rm -v "${{ github.workspace }}:/work" booley-test
          bash -c "pip install --break-system-packages pytest &&
          python /work/crates/bwave/tests/native_fst_verilator_test.py &&
          python -m pytest
          /work/crates/bwave/tests/simulator_ground_truth_test.py
          -q --tb=short"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/bwave

      - name: Build bwave (release)
        run: cargo build --release --manifest-path crates/bwave/Cargo.toml

      - name: Install package with dev deps
        run: pip install -e ".[dev]"

      # `coverage report` enforces pyproject's fail_under gate.
      - name: Run coverage
        run: |
          coverage run -m pytest tests/ -q --tb=short
          coverage report
          coverage xml -o coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
