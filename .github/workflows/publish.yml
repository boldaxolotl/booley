name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches package version
        shell: bash
        run: test "$GITHUB_REF" = "refs/tags/v$(cat VERSION)"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Reject redistributed native and Nangate payloads
        shell: bash
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '/src/booley/data/docker/pdk/'; then
            echo "Nangate payload found in source distribution" >&2
            exit 1
          fi
          if unzip -Z1 dist/*.whl | grep -E '^booley/data/docker/pdk/'; then
            echo "Nangate payload found in wheel" >&2
            exit 1
          fi
          if unzip -Z1 dist/*.whl | grep -E '^booley/data/bin/bwave(\.exe)?$'; then
            echo "Native bwave payload found in platform-neutral wheel" >&2
            exit 1
          fi
          unzip -p dist/*.whl '*/METADATA' | grep -Fx 'License-Expression: Apache-2.0'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  build-bwave:
    name: Build BWave (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/bwave

      - name: Build BWave
        run: >-
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          --manifest-path crates/bwave/Cargo.toml

      - name: Verify and package BWave
        shell: bash
        run: |
          version="$(cat VERSION)"
          binary="crates/bwave/target/x86_64-unknown-linux-gnu/release/bwave"
          test "$("$binary" --version)" = "bwave $version"
          mkdir -p dist
          tar -C "$(dirname "$binary")" -czf \
            "dist/bwave-v${version}-linux-x86_64.tar.gz" bwave

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bwave-linux-x86_64
          path: dist/bwave-*
          if-no-files-found: error

  test-wheel:
    needs: build-package
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Install from wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Verify CLI entry point
        run: booley --help

      - name: Verify native bwave is not bundled
        run: |
          python -c "from booley.paths import bwave_binary; p = bwave_binary(); assert not p.exists(), f'unexpected bundled binary: {p}'"

      - name: Verify bwave wrapper entry point
        run: >-
          python -c "import subprocess; result = subprocess.run(['bwave',
          '--help'], capture_output=True, text=True); assert result.returncode == 2,
          result; assert 'Session Runtime' in result.stderr, result.stderr"

  publish:
    needs: test-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # GitHub Release page for the tag: auto-generated notes, the Python
  # wheel/sdist, and a ready-to-run BWave binary for the Linux Session Runtime.
  github-release:
    needs: [test-wheel, build-bwave]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bwave-*
          path: release-assets/
          merge-multiple: true

      - name: Create BWave checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum bwave-* > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            release-assets/*
            THIRD_PARTY_NOTICES.md
