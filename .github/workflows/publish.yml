name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag is not publication evidence by itself. Re-run the same required
  # source workflow against the exact tagged commit before any registry write.
  source-validation:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      packages: read

  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches package version
        shell: bash
        run: test "$GITHUB_REF" = "refs/tags/v$(cat VERSION)"

      - name: Build sdist and wheel
        run: |
          pip install build==1.6.0 twine==7.0.0
          PYTHONPATH=src python -P -c 'from pathlib import Path; from booley.harness.build_stamp import write_build_stamp; write_build_stamp(Path.cwd())'
          trap 'rm -f src/booley/_build_commit.py' EXIT
          python -m build
          twine check dist/*

      - name: Reject redistributed native and Nangate payloads
        run: bash .github/scripts/validate_distribution_payloads.sh dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  build-bwave:
    name: Build BWave (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/bwave

      - name: Build BWave
        run: >-
          cargo build --release --locked --target x86_64-unknown-linux-gnu
          --manifest-path crates/bwave/Cargo.toml

      - name: Verify and package BWave
        shell: bash
        run: |
          version="$(cat VERSION)"
          binary="crates/bwave/target/x86_64-unknown-linux-gnu/release/bwave"
          test "$("$binary" --version)" = "bwave $version"
          mkdir -p dist
          tar -C "$(dirname "$binary")" -czf \
            "dist/bwave-v${version}-linux-x86_64.tar.gz" bwave

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bwave-linux-x86_64
          path: dist/bwave-*
          if-no-files-found: error

  test-wheel:
    needs: build-package
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install from wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Verify CLI entry point
        run: booley --help

      - name: Verify native bwave is not bundled
        run: |
          python -c "from booley.runtime.paths import bwave_binary; p = bwave_binary(); assert not p.exists(), f'unexpected bundled binary: {p}'"

      - name: Verify bwave wrapper entry point
        run: >-
          python -c "import subprocess; result = subprocess.run(['bwave',
          '--help'], capture_output=True, text=True); assert result.returncode == 2,
          result; assert 'Session Runtime' in result.stderr, result.stderr"

  test-sdist:
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Build and install from the exact source distribution
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/sdist-wheel"
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/sdist-wheel" dist/*.tar.gz
          python -m venv "${RUNNER_TEMP}/sdist-venv"
          "${RUNNER_TEMP}/sdist-venv/bin/pip" install "${RUNNER_TEMP}"/sdist-wheel/*.whl
          "${RUNNER_TEMP}/sdist-venv/bin/booley" --help

  publish:
    needs: [source-validation, test-wheel, test-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # GitHub Release page for the tag: auto-generated notes, the Python
  # wheel/sdist, and a ready-to-run BWave binary for the Linux Session Runtime.
  github-release:
    needs: [source-validation, test-wheel, test-sdist, build-bwave]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bwave-*
          path: release-assets/
          merge-multiple: true

      - name: Create BWave checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum bwave-* > SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/*
            release-assets/*
            THIRD_PARTY_NOTICES.md
