name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag matches package version
        shell: bash
        run: test "$GITHUB_REF" = "refs/tags/v$(cat VERSION)"

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Reject redistributed native and Nangate payloads
        shell: bash
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '/src/booley/data/docker/pdk/'; then
            echo "Nangate payload found in source distribution" >&2
            exit 1
          fi
          if unzip -Z1 dist/*.whl | grep -E '^booley/data/docker/pdk/'; then
            echo "Nangate payload found in wheel" >&2
            exit 1
          fi
          if unzip -Z1 dist/*.whl | grep -E '^booley/data/bin/bwave(\.exe)?$'; then
            echo "Native bwave payload found in platform-neutral wheel" >&2
            exit 1
          fi
          unzip -p dist/*.whl '*/METADATA' | grep -Fx 'License-Expression: Apache-2.0'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-wheel:
    needs: build-package
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Install from wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Verify CLI entry point
        run: booley --help

      - name: Verify native bwave is not bundled
        run: |
          python -c "from booley.paths import bwave_binary; p = bwave_binary(); assert not p.exists(), f'unexpected bundled binary: {p}'"

      - name: Verify bwave wrapper entry point
        run: >-
          python -c "import subprocess; result = subprocess.run(['bwave',
          '--help'], capture_output=True, text=True); assert result.returncode == 2,
          result; assert 'Session Runtime' in result.stderr, result.stderr"

  publish:
    needs: test-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # GitHub Release page for the tag: auto-generated notes plus the Python
  # wheel/sdist. The native bwave binary is built into the sandbox image.
  github-release:
    needs: test-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            THIRD_PARTY_NOTICES.md
