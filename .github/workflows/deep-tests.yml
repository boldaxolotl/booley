name: Scheduled deep tests

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bwave-fuzz:
    name: B-Wave parser fuzz and differential tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci/constraints.txt

      # A prefix-restored pip cache never shrinks; see .github/ci/README.md#pip-cache.
      - name: Drop pip cache restored from an older dependency set
        if: steps.setup-python.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: python -m pip cache purge

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly-2026-08-20

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            crates/bwave
            crates/bwave/fuzz

      - name: Install pinned fuzz and differential dependencies
        run: |
          cargo install cargo-fuzz --version 0.13.2 --locked
          pip install -e ".[test]" -c .github/ci/constraints.txt

      # The differential suite generates its oracle VCDs with real simulators
      # and skips each case whose simulator is absent; the zero-skip assertion
      # below rejects such a run, so both simulators must be on PATH. The
      # Verilator oracle compiles and links its model with g++ directly, which
      # `--no-install-recommends` does not pull in, so provision it explicitly
      # rather than relying on the runner image happening to ship a compiler.
      - name: Install differential oracle simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ iverilog verilator

      - name: Record fuzz toolchain
        shell: bash
        run: |
          mkdir -p fuzz-evidence
          rustc --version | tee fuzz-evidence/versions.txt
          cargo --version | tee -a fuzz-evidence/versions.txt
          cargo fuzz --version | tee -a fuzz-evidence/versions.txt
          iverilog -V 2>&1 | sed -n 1p | tee -a fuzz-evidence/versions.txt
          verilator --version | tee -a fuzz-evidence/versions.txt
          g++ --version | sed -n 1p | tee -a fuzz-evidence/versions.txt

      - name: Build B-Wave oracle target
        run: cargo build --release --locked --manifest-path crates/bwave/Cargo.toml

      - name: Replay every committed fuzz regression
        shell: bash
        run: |
          count=0
          while IFS= read -r -d '' input; do
            cargo fuzz run vcd_parser "${input}" --fuzz-dir crates/bwave/fuzz -- -runs=1
            count=$((count + 1))
          done < <(find crates/bwave/fuzz/corpus/vcd_parser -type f -print0)
          test "${count}" -gt 0
          echo "Replayed ${count} committed parser inputs" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run time-bounded VCD parser fuzzing
        shell: bash
        run: |
          mkdir -p crates/bwave/fuzz/artifacts/vcd_parser
          timeout --signal=INT --kill-after=30s 6m \
            cargo fuzz run vcd_parser \
            crates/bwave/fuzz/corpus/vcd_parser crates/bwave/tests/fixtures \
            --fuzz-dir crates/bwave/fuzz -- \
            -max_total_time=300 \
            -artifact_prefix=crates/bwave/fuzz/artifacts/vcd_parser/ \
            -max_len=1048576

      - name: Run existing simulator oracle differential suite
        env:
          BOOLEY_BWAVE_BIN: ${{ github.workspace }}/crates/bwave/target/release/bwave
        run: >-
          pytest crates/bwave/tests/simulator_ground_truth_test.py -q --tb=short -rs
          --junitxml="${RUNNER_TEMP}/bwave-differential.xml"

      - name: Assert differential tests executed without skips
        run: >-
          python .github/scripts/assert_junit.py "${RUNNER_TEMP}/bwave-differential.xml"
          --label "B-Wave simulator differential" --min-tests 1 --max-skips 0
          --summary "${GITHUB_STEP_SUMMARY}"

      - name: Upload fuzz crashes and differential evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bwave-fuzz-evidence
          path: |
            crates/bwave/fuzz/artifacts/
            fuzz-evidence/
            ${{ runner.temp }}/bwave-differential.xml
          if-no-files-found: warn
          retention-days: 30

  worktree-mounts:
    name: Worktree mount Docker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BUILDX_BUILDER: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Issue #2896: the image build preflight needs ~40 GiB free on the Docker
      # storage filesystem, which a stock runner does not have. Same removal
      # list as the Tests workflow's bwave-smoke job; the preflight stays on.
      - name: Free unused runner disk
        uses: ./.github/actions/free-runner-disk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci/constraints.txt
            .github/ci/requirements-build.txt

      # A prefix-restored pip cache never shrinks; see .github/ci/README.md#pip-cache.
      - name: Drop pip cache restored from an older dependency set
        if: steps.setup-python.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: python -m pip cache purge
      - name: Install worktree test environment
        run: pip install -e ".[test]" -c .github/ci/constraints.txt -r .github/ci/requirements-build.txt
      - name: Build canonical Sandbox Image
        id: build-image
        shell: bash
        run: |
          set -o pipefail
          PYTHON="$(command -v python)"
          export PYTHON
          bash src/booley/data/docker/build.sh 2>&1 | tee "${RUNNER_TEMP}/worktree-image-build.log"
      - name: Run required worktree mount cases
        id: worktree-pytest
        env:
          BOOLEY_REQUIRE_WORKTREE_DOCKER: '1'
          BOOLEY_WORKTREE_DOCKER_IMAGE: booley-sandbox:latest
        run: python -m pytest tests/docker/test_worktree_mount_paths_e2e.py -q --tb=short -rs --timeout=300 --junitxml="${RUNNER_TEMP}/worktree-mounts.xml"
      # Only when pytest ran: after a build (or earlier) failure there is no
      # JUnit file, and this step would add a second, misleading failure.
      - name: Assert worktree execution evidence
        if: always() && (steps.worktree-pytest.outcome == 'success' || steps.worktree-pytest.outcome == 'failure')
        run: python .github/scripts/assert_junit.py "${RUNNER_TEMP}/worktree-mounts.xml" --min-tests 1 --max-skips 0
      # The build step tees its log, so once it ran a missing file is a real
      # evidence gap; before it ran, upload would only add a second failure.
      - name: Upload worktree execution evidence
        if: always() && steps.build-image.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worktree-mounts-evidence
          path: |
            ${{ runner.temp }}/worktree-mounts.xml
            ${{ runner.temp }}/worktree-image-build.log
          if-no-files-found: error
          retention-days: 30
